<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catholic Church Finder</title>
<meta name="description" content="An interactive 3D globe of Catholic churches around the world. Click a pin to see a photo and details of the church.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Church Finder">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2305070d'/%3E%3Cpath d='M16 5v22M10 11h12' stroke='%23e8b84a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed night globe; a slim header rail, a search well, and a details card that slides in from the right (bottom sheet on phones). */
:root {
  --space: #05070d;
  --ocean: #0a1a33;
  --land: #1b2a40;
  --land-edge: #33496a;
  --ink: #e9e4d6;
  --ink-soft: #a8adbb;
  --ink-faint: #6f7689;
  --gold: #e8b84a;
  --gold-soft: #f3d58c;
  --cardinal: #d2484f;
  --marian: #6aa7ff;
  --panel: rgba(12, 18, 32, 0.86);
  --panel-solid: #0e1526;
  --line: rgba(233, 228, 214, 0.12);
  --focus: #f3d58c;
  --font-display: "Cinzel", "Trajan Pro", "Times New Roman", serif;
  --font-ui: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; padding: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { background: var(--space); color: var(--ink); font-family: var(--font-ui); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

#stage { position: fixed; inset: 0; background:
  radial-gradient(1px 1px at 12% 18%, #fff8 50%, transparent 51%),
  radial-gradient(1px 1px at 72% 12%, #fff6 50%, transparent 51%),
  radial-gradient(1.5px 1.5px at 85% 64%, #fff7 50%, transparent 51%),
  radial-gradient(1px 1px at 33% 78%, #fff5 50%, transparent 51%),
  radial-gradient(1px 1px at 55% 40%, #fff4 50%, transparent 51%),
  radial-gradient(1px 1px at 8% 60%, #fff6 50%, transparent 51%),
  radial-gradient(1.2px 1.2px at 92% 30%, #fff5 50%, transparent 51%),
  radial-gradient(1px 1px at 44% 8%, #fff5 50%, transparent 51%),
  radial-gradient(1px 1px at 64% 90%, #fff4 50%, transparent 51%),
  radial-gradient(1px 1px at 22% 42%, #fff3 50%, transparent 51%),
  radial-gradient(ellipse at 50% 120%, #10213f 0%, var(--space) 60%);
}
#map { position: absolute; inset: 0; }

/* maplibre core */
.maplibregl-map { overflow: hidden; position: relative; -webkit-tap-highlight-color: transparent; }
.maplibregl-canvas { left: 0; position: absolute; top: 0; }
.maplibregl-canvas-container.maplibregl-interactive { cursor: grab; user-select: none; }
.maplibregl-canvas-container.maplibregl-interactive:active { cursor: grabbing; }
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan,
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan .maplibregl-canvas { touch-action: none; }
.maplibregl-canvas-container.maplibregl-touch-drag-pan,
.maplibregl-canvas-container.maplibregl-touch-drag-pan .maplibregl-canvas { touch-action: pinch-zoom; }
.maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-top-left, .maplibregl-ctrl-top-right { display: none; }

/* header */
.top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  padding-top: max(14px, env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 20px;
}
.top > * { pointer-events: auto; }
.top:has(.results:not([hidden])) { z-index: 12; } /* search results float over an open card */
.top::before { content: ""; position: absolute; inset: 0 0 -40px; z-index: -1; pointer-events: none; background: linear-gradient(to bottom, rgba(5,7,13,.82), rgba(5,7,13,.5) 60%, rgba(5,7,13,0)); }
.foot::before { content: ""; position: absolute; inset: -24px 0 0; z-index: -1; pointer-events: none; background: linear-gradient(to top, rgba(5,7,13,.8), rgba(5,7,13,0)); }
.brand { display: grid; gap: 2px; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: 0.08em; color: var(--ink); text-shadow: 0 2px 18px #000; line-height: 1.1; }
.brand h1 .cross { color: var(--gold); margin-right: 8px; }
.brand p { margin: 0; color: var(--ink-soft); font-size: 13px; text-shadow: 0 1px 8px #000; }
.brand p b { color: var(--gold-soft); font-weight: 600; font-variant-numeric: tabular-nums; }

.search { position: relative; z-index: 3; flex: 1 1 320px; max-width: 440px; margin-left: auto; }
.search input {
  width: 100%; height: 42px; border-radius: 21px; border: 1px solid var(--line);
  background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 0 16px 0 40px; outline: none; color: var(--ink);
}
.search input::placeholder { color: var(--ink-faint); }
.search input:focus { border-color: color-mix(in srgb, var(--gold) 60%, transparent); }
.search svg { position: absolute; left: 14px; top: 13px; width: 16px; height: 16px; stroke: var(--ink-soft); z-index: 1; pointer-events: none; }
.results {
  position: absolute; top: 48px; left: 0; right: 0; max-height: min(60vh, 420px); overflow-y: auto;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 14px; padding: 6px;
  box-shadow: 0 20px 50px #000a; display: grid; gap: 2px;
}
.results button { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: center; text-align: left; width: 100%; padding: 8px 10px; border: 0; background: transparent; border-radius: 9px; cursor: pointer; }
.results button:hover, .results button[aria-selected="true"] { background: rgba(232, 184, 74, 0.12); }
.results .nm { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .loc { display: block; font-size: 12px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .note { padding: 10px; color: var(--ink-soft); font-size: 13px; }
.results div { min-width: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; align-items: center; }
.chips .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); margin-right: 2px; text-shadow: 0 1px 6px #000; flex: none; }
.chips.filtered .chip[aria-pressed="false"] { opacity: .5; }
.chips.filtered .chip[aria-pressed="false"] i { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--ink-faint); }
.chip .tick { display: none; width: 12px; height: 12px; stroke: var(--gold-soft); fill: none; stroke-width: 2.4; margin-left: -2px; }
.chips.filtered .chip[aria-pressed="true"] .tick { display: inline-block; }
.chip {
  height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--line); background: var(--panel);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer; font-size: 12.5px; color: var(--ink-soft);
  display: inline-flex; align-items: center; gap: 7px; letter-spacing: 0.01em;
}
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: color-mix(in srgb, var(--gold) 55%, transparent); background: rgba(232, 184, 74, 0.14); }
.chip small { color: var(--ink-faint); font-variant-numeric: tabular-nums; font-size: 11.5px; }

/* side controls */
.ctrls {
  position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(44px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 8px; transition: right .35s cubic-bezier(.2,.8,.2,1), bottom .35s cubic-bezier(.2,.8,.2,1);
}
/* the controls step aside for an open details card instead of hiding under it */
body.card-open .ctrls { right: calc(max(16px, env(safe-area-inset-right, 0px)) + min(420px, calc(100vw - 32px)) + 12px); }
.ctrls button {
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer; display: grid; place-items: center;
}
.ctrls button:hover { border-color: color-mix(in srgb, var(--gold) 50%, transparent); }
.ctrls button[aria-pressed="true"] { background: rgba(232, 184, 74, 0.18); }
.ctrls svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.foot {
  position: fixed; z-index: 4; left: 0; right: 0; bottom: 0;
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); padding-top: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 14px; align-items: center; font-size: 11.5px; color: var(--ink-faint); pointer-events: none; flex-wrap: wrap;
}
.foot > * { pointer-events: auto; }
.foot button { background: none; border: 0; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0; font-size: 11.5px; }
.foot .coords { font-family: var(--font-data); font-variant-numeric: tabular-nums; margin-left: auto; }

/* favorites */
.ctrls button.fav-open { position: relative; }
.ctrls .count { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--gold); color: #1a1406; font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.ctrls .count:empty { display: none; }
.favs {
  position: fixed; z-index: 9; left: max(16px, env(safe-area-inset-left, 0px)); top: 132px; max-height: calc(100% - 190px); width: 320px;
  display: flex; flex-direction: column; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 18px 48px #000a;
  transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s ease;
}
.favs[hidden] { display: flex !important; transform: translateX(calc(-100% - 40px)); opacity: 0; pointer-events: none; }
.favs header { display: flex; align-items: center; gap: 10px; padding: 16px 12px 10px 18px; }
.favs h2 { margin: 0; flex: 1; font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .06em; }
.favs h2 small { font-family: var(--font-ui); font-weight: 500; font-size: 12px; color: var(--ink-faint); letter-spacing: 0; margin-left: 6px; }
.favs .x { width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; }
.favs .x svg { width: 16px; height: 16px; stroke: var(--ink-soft); stroke-width: 2; }
.favs ul { list-style: none; margin: 0; padding: 0 8px 10px; overflow-y: auto; flex: 1; }
.favs li { display: grid; grid-template-columns: 1fr auto; align-items: center; border-radius: 10px; }
.favs li:hover { background: rgba(232, 184, 74, 0.1); }
.favs li button.go { text-align: left; background: none; border: 0; cursor: pointer; padding: 9px 10px; min-width: 0; color: var(--ink); display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; align-items: center; }
.favs li .nm { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.favs li .dist { font-family: var(--font-data); font-size: 11.5px; color: var(--gold-soft); padding-right: 12px; font-variant-numeric: tabular-nums; }
.favs li .loc { display: block; font-size: 12px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.favs li i { width: 9px; height: 9px; border-radius: 50%; }
.favs li button.rm { width: 32px; height: 32px; margin-right: 4px; border-radius: 50%; border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--ink-faint); }
.favs li button.rm:hover { color: var(--ink); background: rgba(255,255,255,.06); }
.favs li button.rm svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; }
.favs .empty { padding: 4px 18px 18px; color: var(--ink-soft); font-size: 13px; line-height: 1.5; margin: 0; }
.favs .empty svg { width: 14px; height: 14px; vertical-align: -2px; fill: #e0607e; stroke: none; }
.btn.save svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }
.btn.save[aria-pressed="true"] { border-color: #e0607e; color: #ffd3dd; }
.btn.save[aria-pressed="true"] svg { fill: #e0607e; stroke: #e0607e; }
.ctrls button.fav-open svg { stroke: #f2a1b4; }

/* about this church + gallery */
.about-church .extract { margin: 0 0 6px; line-height: 1.55; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.about-church .more, .patron .more { color: var(--gold-soft); font-size: 13px; text-underline-offset: 3px; }
.about-church .facts { margin-top: 12px; }
.patron { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.02); }
.patron .pimg img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; object-position: top; display: block; border: 1.5px solid color-mix(in srgb, var(--gold) 55%, transparent); }
.patron .plabel { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 2px; }
.patron b { font-weight: 600; }
.patron .feast { font-size: 12px; color: var(--gold-soft); margin-top: 2px; }
.patron p { margin: 4px 0 6px; font-size: 13px; line-height: 1.5; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.patron small { display: block; margin-top: 4px; font-size: 11px; color: var(--ink-faint); }
.card .body > * { min-width: 0; }
.strip { display: flex; gap: 6px; overflow-x: auto; margin-top: 14px; padding-bottom: 4px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
.strip button { flex: none; width: 92px; height: 70px; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; background: var(--land); scroll-snap-align: start; }
.strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
.strip button:hover { border-color: var(--gold); }
.card .hero .gal-btn { position: absolute; right: 14px; bottom: 12px; z-index: 1; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; border: 0; background: rgba(5,7,13,.62); color: #fff; font-size: 12px; cursor: pointer; }
.card .hero .gal-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.lightbox { position: fixed; inset: 0; z-index: 40; background: rgba(2,3,8,.97); display: grid; grid-template-rows: 1fr auto; }
.lb-stage { display: grid; place-items: center; padding: 56px 64px 8px; min-height: 0; }
.lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; opacity: 0; transition: opacity .3s ease; user-select: none; -webkit-user-drag: none; }
.lb-stage img.on { opacity: 1; }
.lb-nav, .lb-close { position: absolute; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgba(14,20,34,.8); cursor: pointer; display: grid; place-items: center; }
.lb-nav svg, .lb-close svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2; }
.lb-nav { top: 50%; transform: translateY(-50%); } .lb-nav.prev { left: 12px; } .lb-nav.next { right: 12px; }
.lb-close { top: max(12px, env(safe-area-inset-top, 0px)); right: 12px; }
.lb-bar { display: flex; gap: 14px; align-items: center; justify-content: center; padding: 10px 16px max(14px, env(safe-area-inset-bottom, 0px)); font-size: 12.5px; color: var(--ink-soft); text-align: center; flex-wrap: wrap; }
.lb-bar #lbCount { font-family: var(--font-data); color: var(--gold-soft); }
.lb-bar a { color: var(--ink-soft); }
@media (max-width: 640px) { .lb-stage { padding: 56px 8px 8px; } .lb-nav { top: auto; bottom: 64px; transform: none; } }

/* tooltip */
.tip {
  position: fixed; z-index: 6; pointer-events: none; background: var(--panel-solid); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; font-size: 12.5px; max-width: 280px; box-shadow: 0 8px 24px #0009;
  transform: translate(-50%, calc(-100% - 14px));
}
.tip b { font-weight: 600; display: block; }
.tip span { color: var(--ink-soft); font-size: 11.5px; }

/* loading veil */
.veil { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--space); transition: opacity .9s ease; }
.veil.gone { opacity: 0; pointer-events: none; }
.veil div { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 0 24px; }
.veil h2 { margin: 0; font-family: var(--font-display); font-weight: 500; letter-spacing: 0.14em; font-size: 20px; }
.veil p { margin: 0; color: var(--ink-soft); font-size: 13px; }
.veil .bar { width: 200px; height: 2px; background: var(--line); border-radius: 1px; overflow: hidden; }
.veil .bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s; }

/* details card */
.card {
  position: fixed; z-index: 10; top: max(16px, env(safe-area-inset-top, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px));
  right: max(16px, env(safe-area-inset-right, 0px)); width: min(420px, calc(100vw - 32px));
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
  box-shadow: 0 30px 80px #000c; display: flex; flex-direction: column;
  transform: translateX(0); opacity: 1; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s;
}
.card[hidden] { display: flex !important; transform: translateX(calc(100% + 40px)); opacity: 0; pointer-events: none; }
.card .hero { position: relative; height: 190px; flex: none; overflow: hidden; }
.card .hero svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.card .hero .badge {
  position: absolute; left: 16px; bottom: 14px; font-family: var(--font-display); font-size: 11px; letter-spacing: 0.18em;
  text-transform: uppercase; background: rgba(5, 7, 13, 0.55); padding: 5px 10px; border-radius: 4px; color: var(--gold-soft);
}
.card .hero .suntime { position: absolute; right: 16px; bottom: 14px; font-family: var(--font-data); font-size: 11px; color: #fffc; background: rgba(5,7,13,.45); padding: 4px 8px; border-radius: 4px; }
/* real photo: fades in over the drawn scene, which stays as the fallback */
.card .hero img.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .7s ease; }
.card .hero img.photo.on { opacity: 1; }
.card .hero.has-photo .suntime { display: none; }
.card .hero.has-photo::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, rgba(5,7,13,.55), transparent 32%, transparent 68%, rgba(5,7,13,.5)); }
.card .hero .badge, .card .hero .credit { z-index: 1; }
.card .hero .credit {
  position: absolute; left: 14px; top: 14px; right: 60px; font-size: 11px; line-height: 1.35; color: #fffd; text-decoration: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px #000c;
}
.card .hero .credit:hover { color: var(--gold-soft); text-decoration: underline; }
/* preloader: a votive candle that flickers while the photo loads */
.card .hero .vigil { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; align-content: center; gap: 6px; background: rgba(5,7,13,.72); transition: opacity .5s ease; }
.card .hero .vigil.out { opacity: 0; }
.card .hero .vigil svg { width: 54px; height: 82px; overflow: visible; }
.card .hero .vigil span { font-family: var(--font-display); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-soft); opacity: .85; }
.vigil .flame { transform-origin: 30px 44px; animation: flicker 1.6s ease-in-out infinite; }
.vigil .halo { transform-origin: 30px 30px; animation: halo 2.4s ease-in-out infinite; }
@keyframes flicker { 0%, 100% { transform: scale(1, 1) skewX(0deg); } 25% { transform: scale(.94, 1.06) skewX(2deg); } 50% { transform: scale(1.03, .95) skewX(-2deg); } 75% { transform: scale(.97, 1.04) skewX(1deg); } }
@keyframes halo { 0%, 100% { opacity: .65; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
.card .close {
  position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; border: 0;
  background: rgba(5, 7, 13, 0.6); cursor: pointer; display: grid; place-items: center; z-index: 2;
}
.card .close svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 2; }
.card .body { padding: 18px 20px 20px; overflow-y: auto; display: grid; gap: 18px; align-content: start; }

.facts { display: grid; grid-template-columns: auto 1fr; gap: 9px 16px; margin: 0; font-size: 13.5px; }
.facts dt { color: var(--ink-faint); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding-top: 2px; }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.facts dd.wide { grid-column: 1 / -1; }
.facts a { color: var(--gold-soft); text-underline-offset: 3px; }
.facts .mono { font-family: var(--font-data); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.sect h3 { margin: 0 0 10px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; }
.media { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.media a {
  display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--line); text-decoration: none; color: var(--ink); background: rgba(255,255,255,0.02); min-width: 0;
}
.media a:hover { border-color: color-mix(in srgb, var(--gold) 50%, transparent); background: rgba(232,184,74,0.07); }
.media a span { min-width: 0; }
.media b { display: block; font-weight: 500; font-size: 13px; }
.media small { display: block; color: var(--ink-faint); font-size: 11.5px; }
.media svg { width: 24px; height: 24px; stroke: var(--gold); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.prov { font-size: 12px; color: var(--ink-faint); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 12px; }
.prov .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; margin-right: 6px; border: 1px solid var(--line); color: var(--ink-soft); }
.prov .pill.warn { border-color: color-mix(in srgb, var(--gold) 50%, transparent); color: var(--gold-soft); }
.card .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.share-wrap { position: relative; }
.share-menu { position: absolute; z-index: 3; top: calc(100% + 6px); left: 0; min-width: 170px; display: grid; padding: 6px; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px #000b; }
.share-menu a, .share-menu button { text-align: left; padding: 8px 10px; border-radius: 8px; border: 0; background: none; color: var(--ink); font: inherit; font-size: 13px; text-decoration: none; cursor: pointer; }
.share-menu a:hover, .share-menu button:hover { background: rgba(232, 184, 74, 0.12); }
.btn { height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 13px; color: var(--ink); display: inline-flex; align-items: center; gap: 7px; }
.btn:hover { border-color: color-mix(in srgb, var(--gold) 50%, transparent); }
.btn.primary { background: var(--gold); color: #1a1406; border-color: var(--gold); font-weight: 600; }

/* about dialog */
.about { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(2,3,8,.7); padding: 16px; }
.about .box { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 18px; max-width: 600px; width: 100%; max-height: calc(100% - 32px); overflow-y: auto; padding: 24px; display: grid; gap: 14px; line-height: 1.55; }
.about h2 { margin: 0; font-family: var(--font-display); font-weight: 600; letter-spacing: .05em; font-size: 20px; }
.about p { margin: 0; color: var(--ink-soft); max-width: 65ch; }

.about td { padding: 4px 0; border-bottom: 1px solid var(--line); }
.about td:last-child { text-align: right; font-family: var(--font-data); font-size: 12.5px; }
.about .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
.about a { color: var(--gold-soft); }

@media (max-width: 640px) {
  .brand h1 { font-size: 18px; }
  .search { flex-basis: 100%; max-width: none; margin-left: 0; order: 3; }
  .chips { order: 4; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chip { flex: none; }
  .favs { z-index: 11; top: auto; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; bottom: max(8px, env(safe-area-inset-bottom, 0px)); max-height: 60%; }
  .favs[hidden] { transform: translateY(calc(100% + 40px)); }
  .card { top: auto; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; bottom: max(8px, env(safe-area-inset-bottom, 0px)); max-height: 66%; border-radius: 18px; }
  .card[hidden] { transform: translateY(calc(100% + 40px)); }
  .card .hero { height: 130px; }
  .ctrls { bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
  /* on phones the card is a bottom sheet: the controls ride above it in a row */

  .media { grid-template-columns: 1fr; }
  .about .cols { grid-template-columns: 1fr; }
  .foot .coords { display: none; }
}
@media (prefers-reduced-motion: reduce) {

  .vigil .flame, .vigil .halo { animation: none; }

}

<div id="veil" class="veil"><div><h2>✠ Catholic Church Finder</h2><div class="bar"><i id="bar"></i></div><p id="veilMsg">Gathering churches from around the world…</p></div></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
(() => {
'use strict';
const BASE = new URL('.', document.baseURI).href;
const $ = (id) => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// type codes come from the data build: low 3 bits = kind, bit 8 = matched by name only
const TYPES = [
  { code: 1, key: 'cathedral', label: 'Cathedrals', one: 'Cathedral', color: '#d2484f' },
  { code: 2, key: 'basilica', label: 'Basilicas', one: 'Basilica', color: '#f6e7b4' },
  { code: 3, key: 'shrine', label: 'Shrines', one: 'Shrine', color: '#6aa7ff' },
  { code: 6, key: 'parish', label: 'Parishes', one: 'Parish church', color: '#e8b84a' },
  { code: 0, key: 'church', label: 'Churches', one: 'Church', color: '#e8b84a' },
  { code: 5, key: 'chapel', label: 'Chapels', one: 'Chapel', color: '#c9a55e' },
  { code: 4, key: 'abbey', label: 'Abbeys & monasteries', one: 'Abbey or monastery', color: '#9fd3b0' },
];
const TYPE_BY_CODE = Object.fromEntries(TYPES.map(t => [t.code, t]));
const state = { meta: null, lon: null, lat: null, typ: null, n: 0, enabled: new Set(TYPES.map(t => t.code)), shards: new Map(), selected: -1, spinning: false };

const setProgress = (p, msg) => { $('bar').style.width = Math.round(p * 100) + '%'; if (msg) $('veilMsg').textContent = msg; };
const fmt = (n) => n.toLocaleString('en-US');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let regionNames = null; try { regionNames = new Intl.DisplayNames(['en'], { type: 'region' }); } catch (e) {}
const countryName = (cc) => { if (!cc) return ''; try { return regionNames ? regionNames.of(cc) : cc; } catch (e) { return cc; } };

async function getJSON(path) { const r = await fetch(BASE + path); if (!r.ok) throw new Error(path + ' ' + r.status); return r.json(); }

function b64ToBuffer(b64) {
  const bin = atob(b64.trim()); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out.buffer;
}
// glyphs ship as base64 text beside the page; only the Latin range is bundled
maplibregl.addProtocol('glyphs', async (params) => {
  const m = params.url.match(/^glyphs:\/\/([^/]+)\/(\d+-\d+)$/);
  if (!m || m[2] !== '0-255') return { data: new ArrayBuffer(0) };
  const r = await fetch(BASE + 'fonts/' + decodeURIComponent(m[1]) + '-0-255.txt');
  if (!r.ok) throw new Error('glyphs ' + r.status);
  return { data: b64ToBuffer(await r.text()) };
});
async function loadPoints() {
  const r = await fetch(BASE + 'data/points.txt');
  if (!r.ok) throw new Error('points ' + r.status);
  const total = +r.headers.get('content-length') || 0;
  let buf;
  if (r.body && total) {
    const reader = r.body.getReader(); const parts = []; let got = 0;
    for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); got += value.length; setProgress(0.15 + 0.6 * got / total); }
    buf = new Uint8Array(got); let o = 0; for (const p of parts) { buf.set(p, o); o += p.length; }
    buf = new TextDecoder().decode(buf);
  } else buf = await r.text();
  buf = b64ToBuffer(buf);
  const n = buf.byteLength / 9;
  state.n = n;
  state.lon = new Int32Array(buf, 0, n);
  state.lat = new Int32Array(buf, n * 4, n);
  state.typ = new Uint8Array(buf, n * 8, n);
}

function buildGeoJSON() {
  const feats = [];
  const { lon, lat, typ, n, enabled } = state;
  for (let i = 0; i < n; i++) {
    const t = typ[i] & 7;
    if (!enabled.has(t)) continue;
    feats.push({ type: 'Feature', id: i, geometry: { type: 'Point', coordinates: [lon[i] / 1e6, lat[i] / 1e6] }, properties: { t, m: typ[i] >> 3 } });
  }
  return { type: 'FeatureCollection', features: feats };
}
function notableGeoJSON() {
  const feats = [];
  const { lon, lat, typ, n, enabled } = state;
  for (let i = 0; i < n; i++) {
    const t = typ[i] & 7;
    if ((t === 1 || t === 2) && enabled.has(t)) feats.push({ type: 'Feature', id: i, geometry: { type: 'Point', coordinates: [lon[i] / 1e6, lat[i] / 1e6] }, properties: { t } });
  }
  return { type: 'FeatureCollection', features: feats };
}

async function shardFor(i) {
  const s = Math.floor(i / state.meta.shardSize);
  if (!state.shards.has(s)) state.shards.set(s, getJSON('data/d/' + s + '.json').catch(e => { state.shards.delete(s); throw e; }));
  const recs = await state.shards.get(s);
  return recs[i - s * state.meta.shardSize];
}

/* ---------- photos: bundled Wikimedia Commons thumbnails, fetched only when a card opens ---------- */
const photos = { idx: null, loading: null, bundles: new Map(), urls: new Map() };
function photoIndex() {
  if (!photos.loading) photos.loading = getJSON('data/photos.json').then(j => (photos.idx = new Map(j.p.map(r => [r[0], r])))).catch(e => { photos.loading = null; throw e; });
  return photos.loading;
}
async function photoURL(r) {
  const [ci, b, off, len] = r;
  if (photos.urls.has(ci)) return photos.urls.get(ci);
  let part;
  if (photos.bundles.has(b)) part = (await photos.bundles.get(b)).slice(off, off + len);
  else {
    // ask for just this photo's bytes; if the server sends the whole bundle, keep it for neighbours
    const res = await fetch(BASE + 'photos/' + b + '.jpg', { headers: { Range: `bytes=${off}-${off + len - 1}` } });
    if (!res.ok) throw new Error('photo ' + res.status);
    if (res.status === 206) part = await res.blob();
    else { const all = res.blob(); photos.bundles.set(b, all); part = (await all).slice(off, off + len); }
  }
  const url = URL.createObjectURL(new Blob([part], { type: 'image/jpeg' }));
  photos.urls.set(ci, url);
  return url;
}
const VIGIL = `<div class="vigil" role="status"><svg viewBox="0 0 60 90" aria-hidden="true">
  <defs><radialGradient id="vglow"><stop offset="0" stop-color="#f3d58c" stop-opacity=".6"/><stop offset="1" stop-color="#e8b84a" stop-opacity="0"/></radialGradient></defs>
  <circle class="halo" cx="30" cy="30" r="30" fill="url(#vglow)"/>
  <g class="flame"><path d="M30 12c6 9 9 15 9 21a9 9 0 0 1-18 0c0-6 3-12 9-21z" fill="#e8b84a"/><path d="M30 24c3 5 4 8 4 10a4 4 0 0 1-8 0c0-2 1-5 4-10z" fill="#fff4d6"/></g>
  <path d="M30 42v3" stroke="#3a2c14" stroke-width="1.6"/>
  <rect x="20" y="45" width="20" height="40" rx="2.5" fill="#efe6cf"/><rect x="20" y="45" width="20" height="4" rx="2" fill="#fffaf0"/>
  <path d="M30 56v16M24.5 61h11" stroke="#c99a35" stroke-width="2"/>
</svg><span>Loading photo</span></div>`;
let photoTicket = 0;
async function showPhoto(i) {
  const ticket = ++photoTicket, current = () => ticket === photoTicket && state.selected === i;
  const hero = $('hero');
  hero.classList.remove('has-photo');
  hero.querySelectorAll('img.photo, .vigil, .credit, .gal-btn').forEach(n => n.remove());
  hero.insertAdjacentHTML('beforeend', VIGIL);
  const vigil = hero.querySelector('.vigil');
  const done = () => { vigil.classList.add('out'); setTimeout(() => vigil.remove(), reduceMotion ? 0 : 500); };
  let photo = null;
  // fast path: the few cathedral and basilica photos shipped with the site
  try {
    const r = (await photoIndex()).get(i);
    if (r) { const [, , , , file, author, license] = r; photo = { src: await photoURL(r), file, author, license, page: 'https://commons.wikimedia.org/wiki/File:' + encodeURIComponent(file.replace(/ /g, '_')) }; }
  } catch (e) {}
  if (!current()) return;
  if (!photo) {
    let rec; try { rec = await shardFor(i); } catch (e) {}
    if (!current()) return;
    try { photo = (await lookupPhoto(i, rec)).photo; } catch (e) {}
  }
  if (!current()) return;
  if (!photo) { done(); return; }
  const img = new Image(); img.className = 'photo'; img.alt = 'Photograph of ' + (photo.file || 'the church'); img.referrerPolicy = 'no-referrer'; img.src = photo.src;
  try { await img.decode(); } catch (e) { if (!img.complete || !img.naturalWidth) { if (current()) done(); return; } }
  if (!current()) return;
  hero.querySelector('svg.scene').after(img);
  hero.classList.add('has-photo');
  hero.insertAdjacentHTML('beforeend', `<a class="credit" href="${esc(photo.page)}" target="_blank" rel="noopener" title="Photo by ${esc(photo.author)}, ${esc(photo.license)}. Opens the photo on Wikimedia Commons.">Photo: ${esc(photo.author)} · ${esc(photo.license)}</a>`);
  requestAnimationFrame(() => img.classList.add('on'));
  done();
}

/* ---------- live photos: looked up on Wikimedia when a card opens, nothing stored ----------
   Wikipedia articles near the church (lead image, matched by name) win; otherwise the best
   geotagged Commons file near it whose title names the church. */
const live = new Map(); // church index -> Promise<photo|null>
const WIKI_LANG = { BR: 'pt', PT: 'pt', AO: 'pt', MZ: 'pt', CV: 'pt', IT: 'it', SM: 'it', VA: 'it', FR: 'fr', BE: 'fr', LU: 'fr', MC: 'fr', CI: 'fr', CM: 'fr', CD: 'fr', CG: 'fr', SN: 'fr', TG: 'fr', BJ: 'fr', BF: 'fr', MG: 'fr', HT: 'fr', RE: 'fr', MQ: 'fr', GP: 'fr', GF: 'fr', PF: 'fr', NC: 'fr', GA: 'fr', BI: 'fr', RW: 'fr', DE: 'de', AT: 'de', CH: 'de', LI: 'de', PL: 'pl', NL: 'nl', HU: 'hu', CZ: 'cs', SK: 'sk', HR: 'hr', SI: 'sl', LT: 'lt', LV: 'lv', RO: 'ro', UA: 'uk', VN: 'vi', KR: 'ko', JP: 'ja', ID: 'id', TW: 'zh', HK: 'zh', MO: 'zh', CN: 'zh', MT: 'mt', IE: 'en', ...Object.fromEntries('ES MX CO AR PE CL EC VE GT CU BO DO HN PY SV NI CR PA UY PR GQ'.split(' ').map(c => [c, 'es'])) };
const squash = (s) => String(s || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[_\-.,;:()'’"\/]+/g, ' ');
const CHURCHY = /\b(church|chapel|cathedral|basilica|shrine|parish|abbey|monastery|kirche|dom|munster|kapelle|kosciol|katedra|bazylika|iglesia|parroquia|capilla|catedral|ermita|santuario|igreja|paroquia|capela|matriz|chiesa|duomo|cattedrale|basilique|eglise|cathedrale|chapelle|kerk|templom|kostel|crkva|cerkev|baznycia|biserica|nha tho|gereja|katedral|sanctuary|minster|collegiata|pieve|oratorio)\b/;
const GENERIC = new Set('the of and in at de del della di la le les los las da do dos das du des der die das von zu am im y e et und san santa santo sao saint sainte st ste sankt sv sw nossa nuestra senhora senora our lady notre dame church chapel cathedral basilica parish shrine catholic roman iglesia parroquia capilla catedral igreja paroquia capela matriz chiesa parrocchia eglise paroisse chapelle kirche pfarrkirche kosciol parafia rk r k'.split(' '));
const BADFILE = /\b(interior|inside|innen|interno|interieur|altar|organ|orgel|organo|window|vitrail|stained|plan|map|mapa|carte|karte|logo|coat of arms|wappen|grave|tomb|plaque|detail|ceiling|nave|crypt|fresco|statue|painting|icon)\b|\.(svg|pdf|tif|tiff|djvu|webm|ogv|gif)$/i;

    if (d < 250 && (nm >= 0.5 || (churchy && d < 90 && (nm > 0 || !tokens.length)))) score = nm * 3 + (churchy ? 1 : 0) - d / 250;
    else if (nm >= 0.67 && churchy) score = 1.2 + nm - d / 500; // named, a little further off

    if (score > 0 && (!best || score > best.score)) best = { score, page: p };

  const named = ((j.query && j.query.pages) || []).filter(p => tokens.length && nameMatch(tokens, p.title) >= 0.5 && !/\.(svg|pdf|tiff?|djvu|webm|ogv|gif)$/i.test(p.title));

    const nm = nameMatch(tokens, p.title), churchy = CHURCHY.test(squash(p.title));

    OPTIONAL { ?item wdt:P18 ?img. } ?item wdt:P31/wdt:P279? ?type. VALUES ?type { ${WD_TYPES} }

  const [name, , town, , , cc] = rec || [];
  const tokens = nameTokens(name);

    if (!best && first.every(f => f === undefined)) { live.delete(i); return { photo: null }; } // offline or rate limited: try again next click

    const ids = first.filter(f => f && f.sure && f.qid).sort((a, b) => (b.itemScore || b.score) - (a.itemScore || a.score));
    const wiki = (first.find(f => f && f.wiki && f.wiki.lang === langs[0]) || first.find(f => f && f.wiki) || {}).wiki;
    return { photo: best ? best.photo : null, qid: ids.length ? ids[0].qid : null, wiki, named: (first[0] && first[0].named) || [] };
  })();
  live.set(i, job);
  return job;
}

  const rank = (i) => rankOf[state.typ[i] & 7] ?? 4;

  const seen = [...new Set(map.queryRenderedFeatures({ layers: ['pt'] }).map(f => f.id))].sort((a, b) => rank(a) - rank(b));

  const shardIds = new Set(), ids = [];
  for (const i of seen) {
    const sh = Math.floor(i / state.meta.shardSize);
    if (!shardIds.has(sh)) { if (shardIds.size >= 24) continue; shardIds.add(sh); }
    ids.push(i); if (ids.length >= 1500) break;
  }

  if (seq !== nameSeq) return;
  const features = [];
  ids.forEach((i, k) => {
    const name = latinLabel(recs[k][0] || '');
    if (name.length < 2) return;
    features.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [state.lon[i] / 1e6, state.lat[i] / 1e6] }, properties: { name, rank: rank(i), i } });

  </svg>`, sun: `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}` };
}

/* ---------- phone numbers: national format at home, international otherwise, tap to call ---------- */
const phones = { lib: null, loading: null };
function loadPhoneLib() {
  if (!phones.loading) phones.loading = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/libphonenumber-js@1.13.12/bundle/libphonenumber-min.js';
    sc.onload = () => (phones.lib = window.libphonenumber) ? res(phones.lib) : rej();
    sc.onerror = () => { phones.loading = null; rej(); };
    document.head.appendChild(sc);
  });
  return phones.loading;
}
function phoneHTML(raw, cc) {
  let text = raw, tel = String(raw).replace(/[^\d+]/g, '');
  try {
    const p = phones.lib && phones.lib.parsePhoneNumberFromString(String(raw), cc || undefined);
    if (p && p.isPossible()) { text = p.country === cc ? p.formatNational() : p.formatInternational(); tel = p.number; }
  } catch (e) {}
  return `<a href="tel:${esc(tel)}">${esc(text)}</a>`;
}
/* ---------- sharing: the phone's own share sheet, or email and copy on a computer ---------- */
const churchLink = (i) => location.origin + location.pathname + '?church=' + i;
function wireShare(i, name, place) {
  const btn = $('shareBtn'), menu = $('shareMenu'), url = churchLink(i);
  const title = name || 'A Catholic church';
  const text = [title, place].filter(Boolean).join(', ');
  const mobile = coarse && navigator.share;
  const setOpen = (o) => { menu.hidden = !o; btn.setAttribute('aria-expanded', o); };
  $('shareMail').href = `mailto:?subject=${encodeURIComponent(title + ' on Catholic Church Finder')}&body=${encodeURIComponent(text + '\n\nSee it on the globe:\n' + url + '\n')}`;
  $('shareMail').addEventListener('click', () => setOpen(false));
  $('shareMore').hidden = !navigator.share;
  $('shareMore').addEventListener('click', () => { setOpen(false); navigator.share({ title, text, url }).catch(() => {}); });
  $('shareCopy').addEventListener('click', async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(url); ok = true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove();
    }
    $('shareCopy').textContent = ok ? 'Link copied' : 'Copy failed';
    setTimeout(() => { setOpen(false); $('shareCopy').textContent = 'Copy link'; }, 1100);
  });
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (mobile) { navigator.share({ title, text, url }).catch(() => {}); return; }
    setOpen(menu.hidden);
  });
}
addEventListener('click', (e) => { const m = $('shareMenu'); if (m && !m.hidden && !e.target.closest('.share-wrap')) { m.hidden = true; $('shareBtn').setAttribute('aria-expanded', false); } });

const icon = {

  book: '<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 7h6"/></svg>',
};

async function selectChurch(i, { fly = true } = {}) {

  lastInteract = performance.now();
  const wide = innerWidth > 640;

  const t = state.typ[i] & 7; const byName = state.typ[i] >> 3;
  const sc = scene(t, lng, lt);
  const hero = $('hero');

  hero.insertAdjacentHTML('afterbegin', sc.svg);

  const country = countryName(cc);
  const place = [town, region && region !== town ? region : '', country].filter(Boolean).join(', ');
  const q = encodeURIComponent([name, town, country].filter(Boolean).join(' '));
  const qShort = encodeURIComponent([name, town].filter(Boolean).join(' '));
  const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
  const fb = (socials || []).find(s => /facebook\.com/.test(s));
  const webUrl = web && /^https?:\/\//.test(web) ? web : (web ? 'https://' + web : '');
  const confLabel = conf >= 0.8 ? 'High' : conf >= 0.55 ? 'Medium' : 'Low';
  $('cardBody').innerHTML = `
    <div>
      <h2 id="cName">${esc(name)}</h2>
      <div class="where">${esc(place || 'Location on the globe')}</div>
    </div>
    <div class="actions">
      <a class="btn primary" href="${directionsURL(lt, lng, name)}" target="_blank" rel="noopener">Directions</a>
      ${webUrl ? `<a class="btn" href="${esc(webUrl)}" target="_blank" rel="noopener">Parish website</a>` : ''}
      <button class="btn save" id="saveBtn" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg><span>Save</span></button>
      <span class="share-wrap"><button class="btn" id="shareBtn" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg><span>Share</span></button>
        <span class="share-menu" id="shareMenu" role="menu" hidden>
          <a role="menuitem" id="shareMail" href="#">Email a link</a>
          <button role="menuitem" id="shareCopy">Copy link</button>
          <button role="menuitem" id="shareMore" hidden>More options…</button>
        </span></span>
      <button class="btn" id="flyBtn">Fly here</button>
    </div>
    <dl class="facts">
      ${street ? `<dt>Address</dt><dd>${esc(street)}${postcode ? ', ' + esc(postcode) : ''}${town ? '<br>' + esc(town) : ''}</dd>` : ''}
      ${country ? `<dt>Country</dt><dd>${esc(country)}</dd>` : ''}
      ${phone ? `<dt>Phone</dt><dd id="cPhone">${phoneHTML(phone, cc)}</dd>` : ''}
      ${webUrl ? `<dt>Website</dt><dd><a href="${esc(webUrl)}" target="_blank" rel="noopener">${esc(host(webUrl))}</a></dd>` : ''}

        <a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">${icon.video}<span><b>Videos</b><small>YouTube</small></span></a>
        <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lt.toFixed(6)},${lng.toFixed(6)}" target="_blank" rel="noopener">${icon.map}<span><b>Street View</b><small>Google Maps</small></span></a>
        <a href="https://en.wikipedia.org/w/index.php?search=${qShort}" target="_blank" rel="noopener">${icon.book}<span><b>History</b><small>Wikipedia</small></span></a>
      </div>
    </div>

      <span class="pill">${confLabel} confidence</span>${how === 'name' ? '<span class="pill warn">Identified as Catholic by its name</span>' : '<span class="pill">Listed as Roman Catholic</span>'}
      <div style="margin-top:8px">Source: Overture Maps places (${esc((datasets || []).join(', ') || 'Overture')})${updated ? ', updated ' + esc(updated) : ''}.</div>
    </div>`;
  if (phone && !phones.lib) loadPhoneLib().then(() => { if (state.selected === i && $('cPhone')) $('cPhone').innerHTML = phoneHTML(phone, cc); }).catch(() => {});
  syncSave(i);
  $('saveBtn').addEventListener('click', () => toggleFav(i, { name, place, t }));

  $('flyBtn').addEventListener('click', () => map.flyTo({ center: [lng, lt], zoom: 16.5, pitch: 50, bearing: map.getBearing() + 40, duration: 2200, padding: wide ? { right: 440, left: 0, top: 0, bottom: 0 } : { bottom: innerHeight * 0.55, top: 0, left: 0, right: 0 } }));
}
function closeCard() {
  $('card').hidden = true; state.selected = -1;
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  if (map.getSource('sel')) map.getSource('sel').setData({ type: 'FeatureCollection', features: [] });
}
$('cardClose').addEventListener('click', closeCard);
addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!$('about').hidden) $('about').hidden = true; else if (!$('favs').hidden) showFavs(false); else if (!$('near').hidden) showNear(false); else if (!$('results').hidden) $('results').hidden = true; else closeCard(); } });

// gently pulse the selection ring
let t0 = performance.now();
function pulse(now) {
  if (state.selected >= 0 && map.getLayer('sel-ring') && !reduceMotion) {
    const k = ((now - t0) % 1600) / 1600;
    map.setPaintProperty('sel-ring', 'circle-radius', 8 + k * 18);
    map.setPaintProperty('sel-ring', 'circle-stroke-opacity', 1 - k);
  }
  requestAnimationFrame(pulse);
}
requestAnimationFrame(pulse);

/* ---------- filter chips ---------- */
function renderChips() {
  const counts = state.meta.types;
  const all = state.enabled.size === TYPES.length;
  const tick = '<svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const tipFor = (t) => all ? `Show only ${t.label.toLowerCase()}` : state.enabled.has(t.code) ? `Hide ${t.label.toLowerCase()}` : `Also show ${t.label.toLowerCase()}`;
  $('chips').classList.toggle('filtered', !all);
  $('chips').innerHTML = `<span class="lbl">Show</span><button class="chip" data-k="all" aria-pressed="${all}" title="${all ? 'Showing every kind of church' : 'Show every kind of church again'}">All</button>` + TYPES.filter(t => counts[t.code]).map(t =>
    `<button class="chip" data-k="${t.code}" aria-pressed="${!all && state.enabled.has(t.code)}" title="${tipFor(t)}">${tick}<i style="background:${t.color}"></i>${t.label} <small>${fmt(counts[t.code])}</small></button>`).join('');
}
$('chips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  const k = b.dataset.k;
  if (k === 'all') state.enabled = new Set(TYPES.map(t => t.code));
  else {
    const c = +k; const all = state.enabled.size === TYPES.length;
    if (all) state.enabled = new Set([c]);
    else if (state.enabled.has(c)) { state.enabled.delete(c); if (!state.enabled.size) state.enabled = new Set(TYPES.map(t => t.code)); }
    else state.enabled.add(c);
    // "Churches" and "Parishes" read as one idea to most people, so they toggle together
    if (c === 0 || c === 6) { if (state.enabled.has(c)) { state.enabled.add(0); state.enabled.add(6); } else { state.enabled.delete(0); state.enabled.delete(6); } if (!state.enabled.size) state.enabled = new Set(TYPES.map(t => t.code)); }
  }
  renderChips();
  // whatever the filter now hides leaves the screen at once: its name label and, if open, its card
  nameFeatures = nameFeatures.filter(f => state.enabled.has(state.typ[f.properties.i] & 7));
  map.getSource('names').setData({ type: 'FeatureCollection', features: nameFeatures });
  if (state.selected >= 0 && !state.enabled.has(state.typ[state.selected] & 7)) closeCard();
  map.getSource('churches').setData(buildGeoJSON());
  map.getSource('notable').setData(notableGeoJSON());
  updateTagline();
  map.once('idle', updateNames);
});
function updateTagline() {
  let n = 0; for (const t of state.enabled) n += state.meta.types[t] || 0;
  const all = state.enabled.size === TYPES.length;
  $('tagline').innerHTML = all ? `<b>${fmt(state.meta.count)}</b> churches in <b>${state.meta.countries.length}</b> countries and territories` : `Showing <b>${fmt(n)}</b> of ${fmt(state.meta.count)} churches`;
}

/* ---------- search ---------- */
let searchIdx = null, searchLoading = null;
const fold = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function loadSearch() {
  if (searchLoading) return searchLoading;
  searchLoading = (async () => {
    const parts = await Promise.all(Array.from({ length: state.meta.searchChunks }, (_, k) => fetch(BASE + 'data/search-' + k + '.txt').then(r => { if (!r.ok) throw new Error('search'); return r.text(); })));
    const lines = parts.join('\n').split('\n');
    const keys = new Array(lines.length);
    for (let i = 0; i < lines.length; i++) keys[i] = fold(lines[i]);
    searchIdx = { lines, keys };
  })().catch(e => { searchLoading = null; throw e; });
  return searchLoading;
}
const qEl = $('q'), resEl = $('results');
let activeRes = -1;
qEl.addEventListener('focus', () => { loadSearch().catch(() => {}); if (qEl.value.trim()) runSearch(); });
let qTimer = 0;
qEl.addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(runSearch, 120); });
async function runSearch() {
  const q = fold(qEl.value.trim());
  if (q.length < 2) { resEl.hidden = true; return; }
  resEl.hidden = false;
  if (!searchIdx) { resEl.innerHTML = '<div class="note">Loading the church index…</div>'; try { await loadSearch(); } catch (e) { resEl.innerHTML = '<div class="note">The church index did not load. Check your connection and try again.</div>'; return; } }
  const toks = q.split(/\s+/).filter(Boolean);
  const { keys, lines } = searchIdx; const hits = [];
  for (let i = 0; i < keys.length && hits.length < 400; i++) {
    const k = keys[i]; let ok = true;
    for (const t of toks) if (k.indexOf(t) < 0) { ok = false; break; }
    if (ok && state.enabled.has(state.typ[i] & 7)) hits.push(i);
  }
  const score = (i) => { const k = keys[i]; const ty = state.typ[i] & 7; return (k.startsWith(toks[0]) ? 0 : 2) + (ty === 1 || ty === 2 ? -1.5 : ty === 3 ? -0.5 : 0) + (state.typ[i] >> 3) * 0.6 + k.length / 200; };
  hits.sort((a, b) => score(a) - score(b));
  const top = hits.slice(0, 30);
  activeRes = -1;
  if (!top.length) { resEl.innerHTML = `<div class="note">No churches match “${esc(qEl.value.trim())}”. Try the town name or a saint’s name.</div>`; return; }
  resEl.innerHTML = top.map((i, k) => {
    const [nm, town, cc] = lines[i].split('\t'); const t = TYPE_BY_CODE[state.typ[i] & 7];
    return `<button role="option" data-i="${i}" id="r${k}"><i style="width:9px;height:9px;border-radius:50%;background:${t.color};justify-self:center"></i><div><span class="nm">${esc(nm)}</span><span class="loc">${esc([t.one, town, countryName(cc)].filter(Boolean).join(' · '))}</span></div></button>`;
  }).join('') + (hits.length > 30 ? `<div class="note">${hits.length >= 400 ? '400+' : hits.length} matches. Add a town to narrow it down.</div>` : '');
}
resEl.addEventListener('click', (e) => { const b = e.target.closest('button[data-i]'); if (!b) return; pickResult(+b.dataset.i); });
function pickResult(i) { resEl.hidden = true; qEl.blur(); selectChurch(i, { fly: true }); }
qEl.addEventListener('keydown', (e) => {
  const opts = [...resEl.querySelectorAll('button[data-i]')]; if (!opts.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); activeRes = (activeRes + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length; opts.forEach((o, k) => o.setAttribute('aria-selected', k === activeRes)); opts[activeRes].scrollIntoView({ block: 'nearest' }); }
  else if (e.key === 'Enter') { e.preventDefault(); pickResult(+opts[Math.max(activeRes, 0)].dataset.i); }
});
document.addEventListener('pointerdown', (e) => { if (!e.target.closest('.search')) resEl.hidden = true; });

/* ---------- about ---------- */
$('aboutBtn').addEventListener('click', () => {
  const m = state.meta; if (!m) return;
  const rows = m.countries.slice(0, 20).map(([cc, n]) => `<tr><td>${esc(countryName(cc) || 'Unknown')}</td><td>${fmt(n)}</td></tr>`);

  $('aboutBox').innerHTML = `

    <p>The globe shows <b>${fmt(m.count)}</b> Catholic churches, chapels, shrines, basilicas and cathedrals. They come from the <a href="https://docs.overturemaps.org/guides/places/" target="_blank" rel="noopener">Overture Maps places dataset</a> (release ${esc(m.release)}), which gathers places from Meta, Microsoft and other open sources.</p>
    <p>${fmt(m.byMatch.category || 0)} places are listed in Overture as Roman Catholic places of worship. Another ${fmt(m.byMatch.name || 0)} are listed only as Christian places of worship, and the globe includes them because their names are clearly Catholic (for example “Parroquia”, “Paróquia”, “Basilica”, “Nossa Senhora”). Those carry a note in their details.</p>

    <div class="cols"><table>${rows.slice(0, half).join('')}</table><table>${rows.slice(half).join('')}</table></div>
    <p style="font-size:12px">Places data © Overture Maps Foundation, CDLA Permissive 2.0. Basemap from Natural Earth (public domain). Map rendering by MapLibre.</p>
    <div><button class="btn" id="aboutClose">Close</button></div>`;

/* ---------- install as an app: offline cache ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

/* ---------- boot ---------- */
const mapReady = new Promise(res => map.once('load', res));
(async () => {
  try {
    setProgress(0.05);
    state.meta = await getJSON('data/meta.json');

    let opened = false;

      // open over the United States

      map.flyTo({ center: [-97.5, 38.5], zoom: innerWidth < 640 ? 2.3 : 3.3, duration: reduceMotion ? 0 : 3200, essential: true });

  }

})();
