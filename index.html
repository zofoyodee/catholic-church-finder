<style>
/* Layout: one full-bleed night globe; a slim header rail, a search well, and a details card that slides in from the right (bottom sheet on phones). */
:root {
  --space: #05070d;
  --ocean: #0a1a33;
  --land: #1b2a40;
  --land-edge: #33496a;
  --ink: #e9e4d6;
  --ink-soft: #a8adbb;
  --ink-faint: #6f7689;
  --gold: #e8b84a;
  --gold-soft: #f3d58c;
  --cardinal: #d2484f;
  --marian: #6aa7ff;
  --panel: rgba(12, 18, 32, 0.86);
  --panel-solid: #0e1526;
  --line: rgba(233, 228, 214, 0.12);
  --focus: #f3d58c;
  --font-display: "Cinzel", "Trajan Pro", "Times New Roman", serif;
  --font-ui: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; padding: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { background: var(--space); color: var(--ink); font-family: var(--font-ui); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

#stage { position: fixed; inset: 0; background:
  radial-gradient(1px 1px at 12% 18%, #fff8 50%, transparent 51%),
  radial-gradient(1px 1px at 72% 12%, #fff6 50%, transparent 51%),
  radial-gradient(1.5px 1.5px at 85% 64%, #fff7 50%, transparent 51%),
  radial-gradient(1px 1px at 33% 78%, #fff5 50%, transparent 51%),
  radial-gradient(1px 1px at 55% 40%, #fff4 50%, transparent 51%),
  radial-gradient(1px 1px at 8% 60%, #fff6 50%, transparent 51%),
  radial-gradient(1.2px 1.2px at 92% 30%, #fff5 50%, transparent 51%),
  radial-gradient(1px 1px at 44% 8%, #fff5 50%, transparent 51%),
  radial-gradient(1px 1px at 64% 90%, #fff4 50%, transparent 51%),
  radial-gradient(1px 1px at 22% 42%, #fff3 50%, transparent 51%),
  radial-gradient(ellipse at 50% 120%, #10213f 0%, var(--space) 60%);
}
#map { position: absolute; inset: 0; }

/* maplibre core */
.maplibregl-map { overflow: hidden; position: relative; -webkit-tap-highlight-color: transparent; }
.maplibregl-canvas { left: 0; position: absolute; top: 0; }
.maplibregl-canvas-container.maplibregl-interactive { cursor: grab; user-select: none; }
.maplibregl-canvas-container.maplibregl-interactive:active { cursor: grabbing; }
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan,
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan .maplibregl-canvas { touch-action: none; }
.maplibregl-canvas-container.maplibregl-touch-drag-pan,
.maplibregl-canvas-container.maplibregl-touch-drag-pan .maplibregl-canvas { touch-action: pinch-zoom; }
.maplibregl-ctrl-bottom-left, .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-top-left, .maplibregl-ctrl-top-right { display: none; }

/* header */
.top {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  padding-top: max(14px, env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 20px;
}
.top > * { pointer-events: auto; }
.top:has(.results:not([hidden])) { z-index: 12; } /* search results float over an open card */
.top::before { content: ""; position: absolute; inset: 0 0 -40px; z-index: -1; pointer-events: none; background: linear-gradient(to bottom, rgba(5,7,13,.82), rgba(5,7,13,.5) 60%, rgba(5,7,13,0)); }
.foot::before { content: ""; position: absolute; inset: -24px 0 0; z-index: -1; pointer-events: none; background: linear-gradient(to top, rgba(5,7,13,.8), rgba(5,7,13,0)); }
.brand { display: grid; gap: 2px; min-width: 0; }
.brand h1 a { color: inherit; text-decoration: none; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: 0.08em; color: var(--ink); text-shadow: 0 2px 18px #000; line-height: 1.1; }
.brand h1 .cross { color: var(--gold); margin-right: 8px; }
.brand h1 a:hover .cross { text-shadow: 0 0 14px var(--gold); }
.brand p { margin: 0; color: var(--ink-soft); font-size: 13px; text-shadow: 0 1px 8px #000; }
.brand p b { color: var(--gold-soft); font-weight: 600; font-variant-numeric: tabular-nums; }

.search { position: relative; z-index: 3; flex: 1 1 320px; max-width: 440px; margin-left: auto; }
/* language picker: a native select, so phones get their own wheel or sheet */
.langpick { position: relative; flex: none; height: 42px; }
.langpick svg { position: absolute; z-index: 1; left: 12px; top: 13px; width: 16px; height: 16px; stroke: var(--ink-soft); fill: none; stroke-width: 1.7; pointer-events: none; }
.langpick select {
  height: 42px; max-width: 170px; border-radius: 21px; border: 1px solid var(--line); background: var(--panel);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--ink); font: inherit; font-size: 13px;
  padding: 0 14px 0 36px; cursor: pointer; appearance: none; -webkit-appearance: none; outline: none;
}
.langpick select:hover, .langpick select:focus-visible { border-color: color-mix(in srgb, var(--gold) 55%, transparent); }
.langpick option { background: var(--panel-solid); color: var(--ink); }
/* theme picker: the language picker's twin; on phones just the palette icon */
/* theme picker in the footer: a quiet native select with a palette icon */
.themepick { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-soft); }
.themepick svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.7; flex: none; }
.themepick select { appearance: none; -webkit-appearance: none; background: none; border: 0; color: inherit; font: inherit; font-size: 11.5px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0 2px; }
.themepick select:hover, .themepick select:focus-visible { color: var(--ink); }
.themepick option { background: var(--panel-solid); color: var(--ink); }
/* themes: each one only changes the colour tokens; the globe's own palette changes in paintTheme() */
:root[data-theme="marian"] { --space: #030a1c; --ocean: #0b2552; --land: #16386a; --land-edge: #4c78b8; --ink: #eef3ff; --ink-soft: #b2c0dc; --ink-faint: #7486a8;
  --gold: #8fbaff; --gold-soft: #cfe0ff; --marian: #8fbaff; --panel: rgba(9, 22, 50, 0.88); --panel-solid: #0b1a3a; --line: rgba(214, 228, 255, 0.14); --focus: #cfe0ff; }
:root[data-theme="stone"] { --space: #0c0b0a; --ocean: #1b2026; --land: #3a342c; --land-edge: #5a5044; --ink: #efe8da; --ink-soft: #b8ad9a; --ink-faint: #857a69;
  --panel: rgba(26, 23, 20, 0.9); --panel-solid: #1c1915; --line: rgba(239, 232, 218, 0.13); }
:root[data-theme="parchment"] { --space: #efe7d3; --ocean: #b9cbd8; --land: #efe4c8; --land-edge: #a8916a; --ink: #2b2216; --ink-soft: #5e5240; --ink-faint: #85786a;
  --gold: #a8741a; --gold-soft: #8a5c10; --cardinal: #b8323a; --marian: #2f6fd0; --panel: rgba(252, 248, 238, 0.94); --panel-solid: #fcf8ee; --line: rgba(43, 34, 22, 0.16); --focus: #a8741a; }
:root[data-theme="contrast"] { --space: #000; --ocean: #000a1a; --land: #1d1d1d; --land-edge: #fff; --ink: #fff; --ink-soft: #f0f0f0; --ink-faint: #d2d2d2;
  --gold: #ffd400; --gold-soft: #ffe566; --panel: rgba(0, 0, 0, 0.96); --panel-solid: #000; --line: rgba(255, 255, 255, 0.55); --focus: #ffd400; }
/* Liturgical Season: the accents take the colour of the day (set by app/engage.js) */
:root[data-theme="liturgical"] { --gold: var(--season, #e8b84a); --gold-soft: var(--season-soft, #f3d58c); --focus: var(--season-soft, #f3d58c); }
:root[data-theme="parchment"] #stars { display: none; }
:root[data-theme="parchment"] .top::before { background: linear-gradient(to bottom, rgba(239,231,211,.9), rgba(239,231,211,.6) 60%, rgba(239,231,211,0)); }
:root[data-theme="parchment"] .foot::before { background: linear-gradient(to top, rgba(239,231,211,.9), rgba(239,231,211,0)); }
:root[data-theme="parchment"] .season, :root[data-theme="parchment"] .season-i { background: var(--panel); }
:root[data-theme="parchment"] .brand h1, :root[data-theme="parchment"] #tagline, :root[data-theme="parchment"] .chips .lbl { text-shadow: none; }
/* scripts the Latin web fonts don't cover get Noto, loaded only for that language */
:root:lang(vi), :root:lang(uk), :root:lang(ru), :root:lang(yo), :root:lang(ig) { --font-ui: "Noto Sans", "Segoe UI", system-ui, sans-serif; --font-display: "Noto Serif", "Times New Roman", serif; }
:root:lang(ko) { --font-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; --font-display: "Noto Serif KR", serif; }
:root:lang(zh) { --font-ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; --font-display: "Noto Serif SC", serif; }
:root:lang(ar) { --font-ui: "Noto Sans Arabic", "Segoe UI", system-ui, sans-serif; --font-display: "Noto Naskh Arabic", serif; }
:root:lang(ml) { --font-ui: "Noto Sans Malayalam", system-ui, sans-serif; --font-display: "Noto Serif Malayalam", serif; }
:root:lang(ja) { --font-ui: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; --font-display: "Noto Serif JP", serif; }
:root:lang(hi) { --font-ui: "Noto Sans Devanagari", system-ui, sans-serif; --font-display: "Noto Serif Devanagari", serif; }
:root:lang(ta) { --font-ui: "Noto Sans Tamil", system-ui, sans-serif; --font-display: "Noto Serif Tamil", serif; }
:root:is(:lang(ko), :lang(zh), :lang(ar), :lang(ml)) .brand h1, :root:is(:lang(ko), :lang(zh), :lang(ar), :lang(ml)) .chips .lbl { letter-spacing: 0; }
/* right-to-left: text and rows flip, the globe's panels keep their places */
[dir="rtl"] .search svg { left: auto; right: 14px; }
[dir="rtl"] .search input { padding: 0 40px 0 16px; }
[dir="rtl"] .search { margin-left: 0; margin-right: auto; }
[dir="rtl"] .langpick svg { left: auto; right: 12px; }
[dir="rtl"] .langpick select { padding: 0 36px 0 14px; }
[dir="rtl"] .results button { text-align: right; }
[dir="rtl"] .brand h1 .cross { margin-right: 0; margin-left: 8px; }
[dir="rtl"] .share-menu { left: auto; right: 0; }
[dir="rtl"] .share-menu a, [dir="rtl"] .share-menu button, [dir="rtl"] .favs li button.go { text-align: right; }
[dir="rtl"] .foot .coords { margin-left: 0; margin-right: auto; direction: ltr; }
[dir="rtl"] .favs h2 small { margin-left: 0; margin-right: 6px; }
.search input {
  width: 100%; height: 42px; border-radius: 21px; border: 1px solid var(--line);
  background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 0 16px 0 40px; outline: none; color: var(--ink);
}
.search input::placeholder { color: var(--ink-faint); }
.search input:focus { border-color: color-mix(in srgb, var(--gold) 60%, transparent); }
.search svg { position: absolute; left: 14px; top: 13px; width: 16px; height: 16px; stroke: var(--ink-soft); z-index: 1; pointer-events: none; }
.results {
  position: absolute; top: 48px; left: 0; right: 0; max-height: min(60vh, 420px); overflow-y: auto;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 14px; padding: 6px;
  box-shadow: 0 20px 50px #000a; display: grid; gap: 2px;
}
.results button { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: center; text-align: left; width: 100%; padding: 8px 10px; border: 0; background: transparent; border-radius: 9px; cursor: pointer; }
.results button:hover, .results button[aria-selected="true"] { background: rgba(232, 184, 74, 0.12); }
.search .results svg { position: static; }
.results button[data-loc] .loc { white-space: normal; }
.results button.all .nm { color: var(--gold-soft); font-weight: 600; }
.results button.all + button:not(.all) { margin-top: 4px; }
.results .nm { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .loc { display: block; font-size: 12px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .note { padding: 10px; color: var(--ink-soft); font-size: 13px; }
.results div { min-width: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; align-items: center; }
.chips .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); margin-right: 2px; text-shadow: 0 1px 6px #000; flex: none; }
#massChips.filtered .chip[aria-pressed="false"] { opacity: 1; }
.chips.filtered .chip[aria-pressed="false"] { opacity: .5; }
.chips.filtered .chip[aria-pressed="false"] i { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--ink-faint); }
.chip .tick { display: none; width: 12px; height: 12px; stroke: var(--gold-soft); fill: none; stroke-width: 2.4; margin-left: -2px; }
.chips.filtered .chip[aria-pressed="true"] .tick { display: inline-block; }
.chip {
  height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--line); background: var(--panel);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer; font-size: 12.5px; color: var(--ink-soft);
  display: inline-flex; align-items: center; gap: 7px; letter-spacing: 0.01em;
}
#massChips .chip[aria-pressed="true"] { border-color: color-mix(in srgb, var(--gold) 60%, transparent); color: var(--ink); background: rgba(232,184,74,0.14); }
#massChips .tick { fill: none; stroke: currentColor; stroke-width: 2; width: 13px; height: 13px; margin: 0; }
#massChips .lang { cursor: default; padding-right: 6px; }
#massChips select { background: transparent; color: var(--ink); border: 0; font: inherit; font-size: 12.5px; cursor: pointer; max-width: 210px; }
#massChips select option { background: var(--panel-solid); }
#massChips .mass-note { color: var(--ink-faint); font-size: 11.5px; text-shadow: 0 1px 6px #000; }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: color-mix(in srgb, var(--gold) 55%, transparent); background: rgba(232, 184, 74, 0.14); }
.chip small { color: var(--ink-faint); font-variant-numeric: tabular-nums; font-size: 11.5px; }

/* side controls */
.ctrls {
  position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(44px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 8px; transition: right .35s cubic-bezier(.2,.8,.2,1), bottom .35s cubic-bezier(.2,.8,.2,1);
}
/* the controls step aside for an open details card instead of hiding under it */
body.card-open .ctrls { right: calc(max(16px, env(safe-area-inset-right, 0px)) + min(420px, calc(100vw - 32px)) + 12px); }
.ctrls button {
  width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer; display: grid; place-items: center;
}
.ctrls button:hover { border-color: color-mix(in srgb, var(--gold) 50%, transparent); }
.ctrls button[aria-pressed="true"] { background: rgba(232, 184, 74, 0.18); }
.ctrls svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.foot {
  position: fixed; z-index: 4; left: 0; right: 0; bottom: 0;
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); padding-top: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 14px; align-items: center; font-size: 11.5px; color: var(--ink-faint); pointer-events: none; flex-wrap: wrap;
}
.foot > * { pointer-events: auto; }
.foot button { background: none; border: 0; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0; font-size: 11.5px; }
.foot .coords { display: none; }  /* the latitude and longitude readout stays hidden */

/* favorites */
.ctrls button.fav-open { position: relative; animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
.ctrls button[hidden] { display: none; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
.ctrls .count { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--gold); color: #1a1406; font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.ctrls .count:empty { display: none; }
.favs {
  position: fixed; z-index: 9; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(var(--head, 120px) + 12px); max-height: calc(100% - var(--head, 120px) - 12px - var(--favs-gap, 58px)); width: 320px;
  display: flex; flex-direction: column; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 18px 48px #000a;
  transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s ease;
}
.favs[hidden] { display: flex !important; transform: translateX(calc(-100% - 40px)); opacity: 0; pointer-events: none; }
.favs header { display: flex; align-items: center; gap: 10px; padding: 16px 12px 10px 18px; }
.favs h2 { margin: 0; flex: 1; font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .06em; }
.favs h2 small { font-family: var(--font-ui); font-weight: 500; font-size: 12px; color: var(--ink-faint); letter-spacing: 0; margin-left: 6px; }
.favs .x { width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; }
.favs .x svg { width: 16px; height: 16px; stroke: var(--ink-soft); stroke-width: 2; }
.favs ul { list-style: none; margin: 0; padding: 0 8px 10px; overflow-y: auto; flex: 1; }
.favs li { display: grid; grid-template-columns: 1fr auto; align-items: center; border-radius: 10px; }
.favs li:hover { background: rgba(232, 184, 74, 0.1); }
.favs li button.go { text-align: left; background: none; border: 0; cursor: pointer; padding: 9px 10px; min-width: 0; color: var(--ink); display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; align-items: center; }
.favs li .nm { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.favs li .dist { font-family: var(--font-data); font-size: 11.5px; color: var(--gold-soft); padding-right: 12px; font-variant-numeric: tabular-nums; }
.favs li .loc.wrap { white-space: normal; color: var(--ink-faint); }
.favs li .dist .site { display: block; margin-top: 2px; font-family: var(--font-ui, inherit); font-size: 11.5px; color: var(--gold-soft); }
.favs li .loc { display: block; font-size: 12px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.favs li i { width: 9px; height: 9px; border-radius: 50%; }
.favs li button.rm { width: 32px; height: 32px; margin-right: 4px; border-radius: 50%; border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--ink-faint); }
.favs li button.rm:hover { color: var(--ink); background: rgba(255,255,255,.06); }
.favs li button.rm svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; }
.place-form { display: flex; gap: 8px; padding: 2px 18px 8px; margin: 0; }
.place-form input { flex: 1; min-width: 0; height: 38px; border-radius: 19px; border: 1px solid var(--line); background: rgba(255,255,255,.04); padding: 0 14px; font-size: 16px; color: var(--ink); outline: none; }
.place-form input:focus { border-color: color-mix(in srgb, var(--gold) 60%, transparent); }
.place-form .btn { height: 38px; }
.favs details.exact summary { cursor: pointer; color: var(--gold-soft); }
.favs details.exact p { margin: 8px 0; }
.favs li.place-note { display: block; }
.favs .note { padding: 6px 18px 8px; color: var(--ink-soft); font-size: 12.5px; line-height: 1.45; margin: 0; }
.favs .loc .when { color: var(--gold-soft); font-weight: 600; }
.favs .empty { padding: 4px 18px 18px; color: var(--ink-soft); font-size: 13px; line-height: 1.5; margin: 0; }
.favs .empty svg { width: 14px; height: 14px; vertical-align: -2px; fill: #e0607e; stroke: none; }
.btn.save svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }
.btn.save[aria-pressed="true"] { border-color: #e0607e; color: #ffd3dd; }
.btn.save[aria-pressed="true"] svg { fill: #e0607e; stroke: #e0607e; }
.ctrls button.fav-open svg { stroke: #f2a1b4; }

/* about this church + gallery */
.about-church .extract { margin: 0 0 6px; line-height: 1.55; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.about-church .more, .patron .more { color: var(--gold-soft); font-size: 13px; text-underline-offset: 3px; }
.about-church .facts { margin-top: 12px; }
.patron { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.02); }
.patron .pimg img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; object-position: top; display: block; border: 1.5px solid color-mix(in srgb, var(--gold) 55%, transparent); }
.patron .plabel { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 2px; }
.patron b { font-weight: 600; }
.patron .feast { font-size: 12px; color: var(--gold-soft); margin-top: 2px; }
.patron p { margin: 4px 0 6px; font-size: 13px; line-height: 1.5; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.patron small { display: block; margin-top: 4px; font-size: 11px; color: var(--ink-faint); }
.card .body > * { min-width: 0; }
.strip { display: flex; gap: 6px; overflow-x: auto; margin-top: 14px; padding-bottom: 4px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
.strip button { flex: none; width: 92px; height: 70px; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; background: var(--land); scroll-snap-align: start; }
.strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
.strip button:hover { border-color: var(--gold); }
.card .hero .gal-btn { position: absolute; right: 14px; bottom: 12px; z-index: 1; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; border: 0; background: rgba(5,7,13,.62); color: #fff; font-size: 12px; cursor: pointer; }
.card .hero .gal-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.lightbox { position: fixed; inset: 0; z-index: 40; background: rgba(2,3,8,.97); display: grid; grid-template-rows: 1fr auto; }
.lb-stage { display: grid; place-items: center; padding: 56px 64px 8px; min-height: 0; }
.lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; opacity: 0; transition: opacity .3s ease; user-select: none; -webkit-user-drag: none; }
.lb-stage img.on { opacity: 1; }
.lb-nav, .lb-close { position: absolute; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgba(14,20,34,.8); cursor: pointer; display: grid; place-items: center; }
.lb-nav svg, .lb-close svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2; }
.lb-nav { top: 50%; transform: translateY(-50%); } .lb-nav.prev { left: 12px; } .lb-nav.next { right: 12px; }
.lb-close { top: max(12px, env(safe-area-inset-top, 0px)); right: 12px; }
.lb-bar { display: flex; gap: 14px; align-items: center; justify-content: center; padding: 10px 16px max(14px, env(safe-area-inset-bottom, 0px)); font-size: 12.5px; color: var(--ink-soft); text-align: center; flex-wrap: wrap; }
.lb-bar #lbCount { font-family: var(--font-data); color: var(--gold-soft); }
.lb-bar a { color: var(--ink-soft); }
@media (max-width: 640px) { .lb-stage { padding: 56px 8px 8px; } .lb-nav { top: auto; bottom: 64px; transform: none; } }

/* toast */
.toast { position: fixed; z-index: 15; left: 50%; top: 140px; transform: translate(-50%, -8px); opacity: 0; pointer-events: none; transition: opacity .3s ease, transform .3s ease;
  background: var(--panel-solid); border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent); color: var(--ink); padding: 8px 16px; border-radius: 18px; font-size: 13px; box-shadow: 0 10px 30px #000a; white-space: nowrap; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 640px) { .toast { top: 170px; } }

/* tooltip */
.tip {
  position: fixed; z-index: 6; pointer-events: none; background: var(--panel-solid); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; font-size: 12.5px; max-width: 280px; box-shadow: 0 8px 24px #0009;
  transform: translate(-50%, calc(-100% - 14px));
}
.tip b { font-weight: 600; display: block; }
.tip span { color: var(--ink-soft); font-size: 11.5px; }

/* loading veil */
.veil { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--space); transition: opacity .9s ease; }
.veil.gone { opacity: 0; pointer-events: none; }
.veil div { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 0 24px; }
.veil h2 { margin: 0; font-family: var(--font-display); font-weight: 500; letter-spacing: 0.14em; font-size: 20px; }
.veil p { margin: 0; color: var(--ink-soft); font-size: 13px; }
.veil .bar { width: 200px; height: 2px; background: var(--line); border-radius: 1px; overflow: hidden; }
.veil .bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s; }

/* details card */
.card {
  position: fixed; z-index: 10; top: calc(var(--search, 6px) + 10px); bottom: max(16px, env(safe-area-inset-bottom, 0px));  /* starts under the search box */
  right: max(16px, env(safe-area-inset-right, 0px)); width: min(420px, calc(100vw - 32px));
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
  box-shadow: 0 30px 80px #000c; display: flex; flex-direction: column;
  transform: translateX(0); opacity: 1; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s;
}
.card[hidden] { display: flex !important; transform: translateX(calc(100% + 40px)); opacity: 0; pointer-events: none; }
/* right-to-left: the card, its controls and the favorites panel swap sides */
@media (min-width: 641px) {
  [dir="rtl"] .card { right: auto; left: max(16px, env(safe-area-inset-left, 0px)); }
  [dir="rtl"] .card[hidden] { transform: translateX(calc(-100% - 40px)); }
  [dir="rtl"] .ctrls { right: auto; left: max(16px, env(safe-area-inset-left, 0px)); transition: left .35s cubic-bezier(.2,.8,.2,1), bottom .35s cubic-bezier(.2,.8,.2,1); }
  [dir="rtl"] body.card-open .ctrls { right: auto; left: calc(max(16px, env(safe-area-inset-left, 0px)) + min(420px, calc(100vw - 32px)) + 12px); }
  [dir="rtl"] .favs { left: auto; right: max(16px, env(safe-area-inset-right, 0px)); }
  [dir="rtl"] .favs[hidden] { transform: translateX(calc(100% + 40px)); }
}
.card .hero { position: relative; height: 190px; flex: none; overflow: hidden; }
.card .hero svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.card .hero .badge {
  position: absolute; left: 16px; bottom: 14px; font-family: var(--font-display); font-size: 11px; letter-spacing: 0.18em;
  text-transform: uppercase; background: rgba(5, 7, 13, 0.55); padding: 5px 10px; border-radius: 4px; color: var(--gold-soft);
}
.card .hero .suntime { position: absolute; right: 16px; bottom: 14px; font-family: var(--font-data); font-size: 11px; color: #fffc; background: rgba(5,7,13,.45); padding: 4px 8px; border-radius: 4px; }
/* real photo: fades in over the drawn scene, which stays as the fallback */
.card .hero img.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .7s ease; }
.card .hero img.photo.on { opacity: 1; }
.card .hero.has-photo .suntime { display: none; }
.card .hero.has-photo::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, rgba(5,7,13,.55), transparent 32%, transparent 68%, rgba(5,7,13,.5)); }
.card .hero .badge, .card .hero .credit { z-index: 1; }
.card .hero .credit {
  position: absolute; left: 14px; top: 14px; right: 60px; font-size: 11px; line-height: 1.35; color: #fffd; text-decoration: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px #000c;
}
.card .hero .credit:hover { color: var(--gold-soft); text-decoration: underline; }
/* preloader: a votive candle that flickers while the photo loads */
.card .hero .vigil { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; align-content: center; gap: 6px; background: rgba(5,7,13,.72); transition: opacity .5s ease; }
.card .hero .vigil.out { opacity: 0; }
.card .hero .vigil svg { width: 54px; height: 82px; overflow: visible; }
.card .hero .vigil span { font-family: var(--font-display); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-soft); opacity: .85; }
.loader { display: flex; align-items: center; gap: 12px; padding: 16px 12px; color: var(--ink-soft); font-size: 13px; }
.loader svg { width: 20px; height: 30px; flex: none; overflow: visible; }
.loader.big { flex-direction: column; gap: 10px; padding: 36px 16px; text-align: center; }
.loader.big svg { width: 40px; height: 60px; }
.loader.big span { font-family: var(--font-display); letter-spacing: .06em; color: var(--gold-soft); }
.loader.inline { display: inline-flex; gap: 8px; padding: 0; font-size: inherit; color: inherit; vertical-align: middle; }
.loader.inline svg { width: 11px; height: 17px; }
.vigil .flame { transform-origin: 30px 44px; animation: flicker 1.6s ease-in-out infinite; }
.vigil .halo { transform-origin: 30px 30px; animation: halo 2.4s ease-in-out infinite; }
@keyframes flicker { 0%, 100% { transform: scale(1, 1) skewX(0deg); } 25% { transform: scale(.94, 1.06) skewX(2deg); } 50% { transform: scale(1.03, .95) skewX(-2deg); } 75% { transform: scale(.97, 1.04) skewX(1deg); } }
@keyframes halo { 0%, 100% { opacity: .65; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
.card .back {
  position: absolute; top: 12px; left: 12px; height: 34px; padding: 0 14px 0 8px; border-radius: 17px; border: 0;
  background: rgba(5, 7, 13, 0.6); color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; z-index: 2;
}
.card .back svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 2; }
.card .hero:has(#cardBack:not([hidden])) .credit { left: 92px; }
.card .close {
  position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; border: 0;
  background: rgba(5, 7, 13, 0.6); cursor: pointer; display: grid; place-items: center; z-index: 2;
}
.card .close svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 2; }
.card .body { padding: 18px 20px 20px; overflow-y: auto; display: grid; gap: 18px; align-content: start; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 21px; line-height: 1.25; letter-spacing: 0.02em; text-wrap: balance; }
.card .where { color: var(--ink-soft); margin-top: 6px; line-height: 1.45; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 9px 16px; margin: 0; font-size: 13.5px; }
.facts dt { color: var(--ink-faint); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding-top: 2px; }

.facts dd.links { display: flex; flex-wrap: wrap; gap: 6px 16px; }

.facts dd.links svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.facts a { color: var(--gold-soft); text-underline-offset: 3px; }
.facts .mono { font-family: var(--font-data); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.sect h3 { margin: 0 0 10px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; }
.staff { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.staff li { display: flex; align-items: center; gap: 11px; font-size: 13.5px; }
.staff .ph { flex: none; width: 44px; height: 44px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: rgba(232,184,74,0.1); border: 1px solid var(--line); color: var(--gold-soft); font-weight: 600; font-size: 14px; }
.staff .ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
.staff b { display: block; font-weight: 600; }
.staff small { color: var(--ink-soft); font-size: 12px; }
.staff-src { margin: 9px 0 0; font-size: 12px; color: var(--ink-faint); line-height: 1.5; }

.sched { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13.5px; }
.sched li { padding-left: 12px; position: relative; }
.sched-t { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.sched-t th { text-align: left; font-weight: 600; color: var(--gold-soft); padding: 5px 12px 5px 0; vertical-align: top; white-space: nowrap; width: 1%; }
.sched-t td { padding: 5px 0; }
.sched-t .ts { display: flex; flex-wrap: wrap; gap: 2px 14px; }
.sched-t tr + tr th, .sched-t tr + tr td { border-top: 1px solid var(--line); }
.sched-t small { color: var(--ink-soft); font-size: 12px; }
.sched-t tr.monthly { font-size: 12.5px; opacity: 0.8; }
.sched li::before { content: ''; position: absolute; left: 0; top: 0.6em; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); opacity: 0.7; }
.facts .dead { color: var(--ink-faint); }
.facts .moved { color: var(--ink-faint); font-size: 12px; }
.media { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.media a {
  display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--line); text-decoration: none; color: var(--ink); background: rgba(255,255,255,0.02); min-width: 0;
}

.media svg { width: 24px; height: 24px; stroke: var(--gold); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

const NAME_ZOOM = 8;

async function updateNames() {

  const seq = ++nameSeq;
  const rankOf = { 1: 0, 2: 1, 3: 2, 4: 3, 6: 4, 0: 4, 5: 5 };
  const rank = (i) => rankOf[state.typ[i] & 7] ?? 4;
  // at wider zooms there are more pins than room for names: cathedrals and basilicas are named first
  const seen = [...new Set(map.queryRenderedFeatures({ layers: ['pt'] }).map(f => f.id))].sort((a, b) => rank(a) - rank(b));

    const c = map.getCenter(); c.lng += 2.4 * (map.getZoom() < 2 ? 1 : 0.5);

$('spin').addEventListener('click', () => { state.spinning = !state.spinning; $('spin').setAttribute('aria-pressed', state.spinning); if (state.spinning) { lastInteract = 0; spinStep(); } else map.stop(); });

$('zout').addEventListener('click', () => { lastInteract = performance.now(); map.zoomOut({ duration: 400 }); });
$('home').addEventListener('click', () => { closeCard(); if (state.mode === 'bible') { bibleOverview(); return; } if (state.mode === 'jesus') { lifePause(); lifeOverview(); return; } map.flyTo({ center: [map.getCenter().lng, 20], zoom: phoneNow() ? 0.9 : 1.4, pitch: 0, bearing: 0, padding: viewPad(), duration: 1800 }); });

  if (state.mode === 'jesus') { if (life.data) { const evs = lifeEvents(); lifePause(); goEvent(evs[Math.floor(Math.random() * evs.length)].i); } return; }
  if (!state.n) return;
  let i; do { i = Math.floor(Math.random() * state.n); } while (!state.enabled.has(state.typ[i] & 7));

/* ---------- interaction ---------- */
const tip = $('tip');
let hoverId = -1, hoverSeq = 0;
map.on('mousemove', (e) => {
  const lng = e.lngLat.lng, lt = e.lngLat.lat;
  $('coords').textContent = `${Math.abs(lt).toFixed(3)}° ${tr(lt >= 0 ? 'dirN' : 'dirS')}  ${Math.abs(lng).toFixed(3)}° ${tr(lng >= 0 ? 'dirE' : 'dirW')}`;
});
function showTip(x, y, html) { tip.innerHTML = html; tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.hidden = false; }
// pins are picked by proximity, so a tap near a pin counts; touch gets a wider reach
const coarse = matchMedia('(pointer: coarse)').matches;
function pick(point, reach) {
  const box = [[point.x - reach, point.y - reach], [point.x + reach, point.y + reach]];
  const feats = map.queryRenderedFeatures(box, { layers: ['pt', 'notable', 'cl'] });
  let best = null, bestD = Infinity;
  for (const f of feats) {
    const isCl = f.layer.id === 'cl';
    const p = map.project(f.geometry.coordinates);
    let d = Math.hypot(p.x - point.x, p.y - point.y);
    if (isCl) d = Math.max(0, d - clusterRadiusPx(f.properties.point_count)) + reach * 0.6; // pins win ties over clusters
    if (d <= reach * 1.5 && d < bestD) { bestD = d; best = f; }

}
function clusterRadiusPx(n) { return n < 100 ? 6 + 5 * (n - 2) / 98 : n < 1000 ? 11 + 6 * (n - 100) / 900 : n < 10000 ? 17 + 9 * (n - 1000) / 9000 : 26; }
function setHover(i) {
  const src = map.getSource('hover'); if (!src) return;
  src.setData({ type: 'FeatureCollection', features: i < 0 ? [] : [{ type: 'Feature', geometry: { type: 'Point', coordinates: [state.lon[i] / 1e6, state.lat[i] / 1e6] }, properties: { t: state.typ[i] & 7 } }] });
}
map.on('mousemove', async (e) => {
  if (!map.getLayer('pt') || coarse || state.mode !== 'churches') return;
  const f = pick(e.point, 14);
  const cv = map.getCanvas();
  if (!f) { if (hoverId !== -1) { tip.hidden = true; hoverId = -1; hoverSeq++; setHover(-1); } cv.style.cursor = ''; return; }
  if (f.layer.id === 'cl') { cv.style.cursor = 'zoom-in'; if (hoverId !== -1) { tip.hidden = true; hoverId = -1; hoverSeq++; setHover(-1); } return; }
  cv.style.cursor = 'pointer';
  const id = f.id; const p = map.project(f.geometry.coordinates); const r = map.getContainer().getBoundingClientRect();
  tip.style.left = (r.left + p.x) + 'px'; tip.style.top = (r.top + p.y) + 'px';
  if (id === hoverId) return;
  hoverId = id; const seq = ++hoverSeq; setHover(id);
  showTip(r.left + p.x, r.top + p.y, `<b>${esc(TYPE_BY_CODE[state.typ[id] & 7].one)}</b><span>${esc(tr('loadingName'))}</span>`);
  try {
    const rec = await shardFor(id);
    if (seq !== hoverSeq) return;
    tip.innerHTML = `<b>${esc(rec[0])}</b><span>${esc([rec[2], countryName(rec[5])].filter(Boolean).join(', '))}</span><span style="display:block;color:var(--gold-soft)">${esc(tr('clickDetails'))}</span>`;
  } catch (err) { /* tooltip stays generic */ }
});
map.getCanvas().addEventListener('mouseleave', () => { tip.hidden = true; hoverId = -1; hoverSeq++; setHover(-1); });
map.on('mouseenter', 'places', () => { if (state.mode === 'churches') map.getCanvas().style.cursor = 'pointer'; });

$('listHere').addEventListener('click', () => {
  if (state.mode !== 'churches') return;
  const b = map.getBounds(), c = map.getCenter();
  listArea({ bounds: b, center: [c.lng, c.lat] });
});
map.on('click', async (e) => {
  if (!map.getLayer('pt') || state.mode !== 'churches') return;
  const f = pick(e.point, coarse ? 26 : 16);
  if (!f) {
    // a city name: list that city's churches
    const c = map.queryRenderedFeatures([[e.point.x - 6, e.point.y - 6], [e.point.x + 6, e.point.y + 6]], { layers: ['places'] })[0];
    if (c) listArea({ name: c.properties.label || c.properties.name, center: c.geometry.coordinates, pop: c.properties.pop_max || 0 });
    return;
  }
  lastInteract = performance.now();
  if (f.layer.id === 'cl') {
    const z = await map.getSource('churches').getClusterExpansionZoom(f.properties.cluster_id);
    map.easeTo({ center: f.geometry.coordinates, zoom: Math.min(z + 0.5, 16), duration: 900 });
    return;
  }
  tip.hidden = true; setHover(-1);
  selectChurch(f.id, { fly: map.getZoom() < 12 });
});

/* ---------- details card ---------- */
function scene(t, lon, lat) {
  // sky colour follows the sun's hour at the church (solar time from longitude)
  const now = new Date();
  const utcH = now.getUTCHours() + now.getUTCMinutes() / 60;
  const h = ((utcH + lon / 15) % 24 + 24) % 24;
  const skies = h < 5 || h >= 20.5 ? ['#060a1c', '#16224a'] : h < 7 ? ['#2a2f6b', '#e59a6a'] : h < 17.5 ? ['#3e78c4', '#a9cdf0'] : h < 20.5 ? ['#3a2c66', '#f0975a'] : ['#060a1c', '#16224a'];
  const night = h < 5 || h >= 20.5;
  const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
  const ink = '#0b1222';
  const glass = night ? '#f3d58c' : '#3b4a66';
  const shapes = {
    1: `<path d="M118 190V96l14-30 14 30v94zM254 190V96l14-30 14 30v94z"/><path d="M146 190v-70l54-34 54 34v70z"/><path d="M128 66l4-24 4 24M264 66l4-24 4 24"/><circle cx="200" cy="128" r="15" fill="${glass}"/><path d="M190 190v-30a10 10 0 0 1 20 0v30z" fill="${glass}"/><path d="M200 54v-18M194 42h12" stroke="${ink}" stroke-width="3"/>`,
    2: `<path d="M120 190v-56h160v56z"/><path d="M150 134c0-34 22-56 50-56s50 22 50 56z"/><path d="M192 78v-14h16v14z"/><path d="M200 64V44M193 51h14" stroke="${ink}" stroke-width="3"/><path d="M90 190v-36h30v36zM280 190v-36h30v36z"/><g fill="${glass}"><rect x="134" y="150" width="8" height="26"/><rect x="156" y="150" width="8" height="26"/><rect x="178" y="150" width="8" height="26"/><rect x="214" y="150" width="8" height="26"/><rect x="236" y="150" width="8" height="26"/><rect x="258" y="150" width="8" height="26"/></g>`,
    3: `<path d="M140 190v-60l60-40 60 40v60z"/><path d="M188 90V66h24v24z"/><path d="M200 66V46M193 53h14" stroke="${ink}" stroke-width="3"/><circle cx="200" cy="134" r="18" fill="${glass}"/><circle cx="200" cy="56" r="20" fill="none" stroke="${glass}" stroke-width="1.5" opacity=".7"/>`,
    4: `<path d="M110 190v-50h180v50z"/><path d="M230 140V80l18-22 18 22v60z"/><path d="M248 58V40M241 47h14" stroke="${ink}" stroke-width="3"/><g fill="${glass}"><path d="M122 190v-22a8 8 0 0 1 16 0v22z"/><path d="M148 190v-22a8 8 0 0 1 16 0v22z"/><path d="M174 190v-22a8 8 0 0 1 16 0v22z"/><path d="M200 190v-22a8 8 0 0 1 16 0v22z"/></g>`,
    5: `<path d="M160 190v-56l40-30 40 30v56z"/><path d="M190 104V82h20v22z"/><path d="M200 82V62M193 69h14" stroke="${ink}" stroke-width="3"/><path d="M192 190v-24a8 8 0 0 1 16 0v24z" fill="${glass}"/>`,
    0: `<path d="M150 190v-58l50-30 50 30v58z"/><path d="M222 190V92h30v98z"/><path d="M222 92l15-40 15 40z"/><path d="M237 52V34M230 41h14" stroke="${ink}" stroke-width="3"/><path d="M180 190v-26a10 10 0 0 1 20 0v26z" fill="${glass}"/><circle cx="237" cy="112" r="6" fill="${glass}"/>`,
  };
  shapes[6] = shapes[0];
  const stars = night ? Array.from({ length: 26 }, (_, k) => `<circle cx="${(k * 97) % 400}" cy="${(k * 53) % 110}" r="${k % 3 ? 0.7 : 1.2}" fill="#fff" opacity="${0.4 + (k % 4) / 8}"/>`).join('') : '';
  const sunY = night ? 999 : 40 + Math.abs(13 - h) * 9;
  return { svg: `<svg class="scene" viewBox="0 0 400 190" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${skies[0]}"/><stop offset="1" stop-color="${skies[1]}"/></linearGradient></defs>
    <rect width="400" height="190" fill="url(#sk)"/>${stars}
    <circle cx="330" cy="${sunY}" r="16" fill="#fff3c4" opacity=".85"/>
    ${night ? '<circle cx="76" cy="40" r="12" fill="#f4efe0" opacity=".9"/><circle cx="82" cy="36" r="11" fill="' + skies[0] + '"/>' : ''}

/* ---------- phone numbers: national format at home, international otherwise, tap to call ---------- */
const phones = { lib: null, loading: null };
function loadPhoneLib() {
  if (!phones.loading) phones.loading = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/libphonenumber-js@1.13.12/bundle/libphonenumber-min.js';
    sc.onload = () => (phones.lib = window.libphonenumber) ? res(phones.lib) : rej();
    sc.onerror = () => { phones.loading = null; rej(); };
    document.head.appendChild(sc);
  });
  return phones.loading;
}
function phoneHTML(raw, cc) {
  let text = raw, tel = String(raw).replace(/[^\d+]/g, '');
  try {
    const p = phones.lib && phones.lib.parsePhoneNumberFromString(String(raw), cc || undefined);
    if (p && p.isPossible()) { text = p.country === cc ? p.formatNational() : p.formatInternational(); tel = p.number; }
  } catch (e) {}
  return `<a href="tel:${esc(tel)}">${esc(text)}</a>`;
}
/* ---------- sharing: the phone's own share sheet, or email and copy on a computer ---------- */
const churchLink = (i) => location.origin + location.pathname + '?church=' + i;
// keep the church clear of the details card, which sits on the left in right-to-left languages

const phoneNow = () => matchMedia('(max-width: 640px), (max-height: 500px) and (orientation: landscape)').matches;
function viewPad() {
  if (!phoneNow()) return { top: 0, bottom: 0, left: 0, right: 0 };
  const top = Math.round(document.querySelector('.search').getBoundingClientRect().bottom), nav = $('mnav'), r = nav ? nav.getBoundingClientRect() : null;
  const sideways = r && r.height > r.width;  // the tabs run down the left edge
  return { top: Math.max(0, top - 8), bottom: r && !sideways ? Math.round(innerHeight - r.top) : 0, left: sideways ? Math.round(r.right) : 0, right: 0 };
}
const cardPad = (wide) => wide ? { top: 0, bottom: 0, left: i18n.rtl ? 440 : 0, right: i18n.rtl ? 0 : 440 } : { bottom: innerHeight * 0.55, top: 0, left: 0, right: 0 };
function wireShare(i, name, place) {
  const btn = $('shareBtn'), menu = $('shareMenu'), url = churchLink(i);
  const title = name || tr('aChurch');
  const text = [title, place].filter(Boolean).join(', ');
  const mobile = coarse && navigator.share;
  const setOpen = (o) => { menu.hidden = !o; btn.setAttribute('aria-expanded', o); };
  $('shareMail').href = `mailto:?subject=${encodeURIComponent(tr('mailSubject', { name: title }))}&body=${encodeURIComponent(text + '\n\n' + tr('mailBody') + '\n' + url + '\n')}`;
  $('shareMail').addEventListener('click', () => setOpen(false));
  $('shareMore').hidden = !navigator.share;
  $('shareMore').addEventListener('click', () => { setOpen(false); navigator.share({ title, text, url }).catch(() => {}); });
  $('shareCopy').addEventListener('click', async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(url); ok = true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove();
    }
    $('shareCopy').textContent = tr(ok ? 'copied' : 'copyFailed');
    setTimeout(() => { setOpen(false); $('shareCopy').textContent = tr('copyLink'); }, 1100);
  });
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (mobile) { navigator.share({ title, text, url }).catch(() => {}); return; }
    setOpen(menu.hidden);
  });
}
addEventListener('click', (e) => { const m = $('shareMenu'); if (m && !m.hidden && !e.target.closest('.share-wrap')) { m.hidden = true; $('shareBtn').setAttribute('aria-expanded', false); } });

function bibleSearch(q) {
  const d = bible.data; if (!d) { resEl.innerHTML = `<div class="note">${LOADER(tr('bSearchLoading'), 'inline')}</div>`; return; }
  const toks = q.split(/\s+/).filter(Boolean);
  const hit = (s) => { const k = fold(s); return toks.every(t => k.includes(t)); };
  const lands = Object.entries(d.lands).filter(([k, l]) => hit([l.n, l.a, l.also].join(' ')));
  const places = d.places.filter(p => hit([p.n, p.a, d.lands[p.c].n, d.lands[p.c].a].join(' ')))
    .sort((a, b) => (fold(a.n).startsWith(toks[0]) ? 0 : 1) - (fold(b.n).startsWith(toks[0]) ? 0 : 1));
  const ico = (c) => `<i style="width:9px;height:9px;border-radius:50%;background:${c};justify-self:center"></i>`;
  const rows = [...lands.map(([k, l]) => `<button role="option" data-l="${k}">${ico('transparent;box-shadow:inset 0 0 0 2px #e8b84a')}<div><span class="nm">${esc(l.n)}</span><span class="loc">${esc(tr('bCountryOnce', { a: l.a }))}</span></div></button>`),
    ...places.slice(0, 30).map(p => `<button role="option" data-b="${p.id}">${ico(BIBLE_COLORS[mainGroup(p)])}<div><span class="nm">${esc(p.n)}</span><span class="loc">${esc([p.a, d.lands[p.c].n].filter(Boolean).join(' · '))}</span></div></button>`)];

}

function bibleHit(point, reach) {
  if (!map.getLayer('b-pt')) return null;
  const feats = map.queryRenderedFeatures([[point.x - reach, point.y - reach], [point.x + reach, point.y + reach]], { layers: ['b-pt'] });
  let best = null, bestD = Infinity;
  for (const f of feats) { const p = map.project(f.geometry.coordinates); const dd = Math.hypot(p.x - point.x, p.y - point.y); if (dd < bestD) { bestD = dd; best = f; } }
  if (best) return { place: bible.data.byId[best.properties.id] };
  const land = map.queryRenderedFeatures(point, { layers: ['b-land'] })[0];
  return land ? { land: land.properties.k } : null;
}

  for (const [id, light] of [['pt-name', '#f3e9cf'], ['b-pt-name', '#fdf6e3'], ['j-pt-name', '#fdf6e3'], ['me-label', '#cfe3ff']]) { set(id, 'text-color', m.pinText || light); set(id, 'text-halo-color', m.halo); }
  set('b-land-label', 'text-color', m.pinText ? '#8a5c10' : '#f3d58c'); set('b-land-label', 'text-halo-color', m.halo);
  const st = m.streets;
  set('st-water', 'fill-color', st.water); set('st-park', 'fill-color', st.park); set('st-green', 'fill-color', st.park); set('st-building', 'fill-color', st.building);
  set('st-minor', 'line-color', st.minor); set('st-mid', 'line-color', st.mid); set('st-major', 'line-color', st.major); set('st-motorway', 'line-color', st.motorway);
  set('st-names', 'text-color', st.name); set('st-names', 'text-halo-color', st.nameHalo);
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = getComputedStyle(document.documentElement).getPropertyValue('--space').trim() || tc.content;
  document.dispatchEvent(new Event('ccf-theme'));  // app/engage.js redraws the sky
}
function renderThemes() {
  $('themeSel').innerHTML = Object.keys(THEMES).map(k => `<option value="${k}"${k === theme ? ' selected' : ''}>${esc(tr('theme_' + k))}</option>`).join('');
}
$('themeSel').addEventListener('change', (e) => {
  theme = e.target.value in THEMES ? e.target.value : 'night';
  try { localStorage.setItem(THEME_KEY, theme); } catch (err) {}
  document.documentElement.dataset.theme = theme; track('theme/' + theme);
  paintTheme();
});
document.addEventListener('ccf-lang', renderThemes);

/* ---------- hooks for app/engage.js (tours, church of the day, globe view) ---------- */
const hooks = {};
window.ccf = { track, map, state, selectChurch, closeCard, shardFor, getJSON, countryName, esc, reduceMotion, sky: () => themeMap().sky, nightOpacity: () => themeMap().night ?? 1,
  layers: new Promise(r => { hooks.layers = r; }), opened: new Promise(r => { hooks.opened = r; }) };

/* ---------- boot ---------- */
const mapReady = new Promise(res => map.once('load', res));
(async () => {
  try {
    setProgress(0.05);
    state.meta = await getJSON('data/meta.json');
    await langReady;
    setProgress(0.12, tr('gatheringN', { n: state.meta.count }));
    const pts = loadPoints();
    await mapReady;
    await addBasemap();
    await pts;
    setCityLabels();
    setProgress(0.85, tr('placing'));
    await new Promise(r => setTimeout(r, 30));
    addChurchLayers();
    renderThemes(); paintTheme();
    hooks.layers();
    renderFavs();
    renderChips(); updateTagline(); initMassFilters();
    setProgress(1);
    let opened = false;
    const open = () => {
      if (opened) return; opened = true;
      $('veil').classList.add('gone');
      setTimeout(() => { photoIndex().catch(() => {}); loadPhoneLib().catch(() => {}); }, 5000); // warm the small photo index and phone formats once the globe is up
      // open over the United States
      const shared = parseInt(new URLSearchParams(location.search).get('church'), 10);
      hooks.opened({ shared: shared >= 0 && shared < state.n });
      if (innerWidth > 640 || !(shared >= 0 && shared < state.n)) openFavsOnLoad();  // on phones a shared church's card gets the bottom of the screen
      if (shared >= 0 && shared < state.n) { state.ready = true; selectChurch(shared, { fly: true }); return; } // opened from a shared link
      const sp = new URLSearchParams(location.search);
      if (sp.has('jesus') || sp.has('life') || sp.get('mode') === 'jesus') { state.ready = true; setMode('jesus', { fly: !sp.has('jesus') && !sp.has('life') }).then(() => { if (sp.get('jesus')) openLifePlace(sp.get('jesus')); else if (sp.get('life')) goEvent(parseInt(sp.get('life'), 10) - 1, { card: true }); }); return; }
      if (sp.has('bible') || sp.has('land') || sp.get('mode') === 'bible') { state.ready = true; setMode('bible', { fly: !sp.has('bible') && !sp.has('land') }).then(() => { if (sp.get('bible')) openBiblePlace(sp.get('bible')); else if (sp.get('land')) openBibleLand(sp.get('land')); }); return; }
      map.flyTo({ center: [-97.5, 38.5], zoom: innerWidth < 640 ? 2.3 : 3.3, padding: viewPad(), duration: reduceMotion ? 0 : 3200, essential: true });
      map.once('moveend', () => { state.ready = true; });
    };
    map.once('idle', open);
    setTimeout(open, 2500);
  } catch (err) {
    console.error(err);
    $('veilMsg').textContent = tr('dataFailed');
  }
})();
})();
</script>
<script src="app/engage.js"></script>
<script src="app/mobile.js"></script>

<script data-goatcounter="https://zofo.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
