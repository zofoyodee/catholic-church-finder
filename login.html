<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · Catholic Church Finder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2305070d'/%3E%3Cpath d='M16 5v22M10 11h12' stroke='%23e8b84a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="account/account.css">
</head>
<body>
<main class="wrap">
  <a class="brand" href="./"><span class="cross" aria-hidden="true">✠</span>Catholic Church Finder</a>

  <section class="panel" id="signin">
    <h1>Sign in</h1>
    <p class="lede">Sign in to keep your favorite churches on every device.</p>
    <form id="form" novalidate>
      <label>Email
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <label>Password
        <span class="field"><input id="password" type="password" autocomplete="current-password" required><button type="button" class="show" aria-label="Show password" aria-pressed="false">Show</button></span>
      </label>
      <div class="row"><span></span><a href="reset.html">Forgot your password?</a></div>
      <p class="msg" id="msg" aria-live="polite"></p>
      <button class="primary" id="go" type="submit">Sign in</button>
    </form>
  </section>

  <section class="panel done" id="welcome" hidden>
    <div class="icon" aria-hidden="true">✠</div>
    <h1 id="welcomeTitle">Welcome</h1>
    <p class="lede" id="welcomeText">Taking you to the globe…</p>
  </section>

  <p class="alt">New here? <a href="signup.html" id="toSignup">Create an account</a></p>
  <p class="back"><a href="./">Back to the globe</a></p>
</main>

<script src="config.js"></script>
<script src="account/auth.js"></script>
<script src="account/pages.js"></script>
<script>
(function () {
  const { $, say, busy, next } = CCFPage;
  $('toSignup').search = location.search; // keep ?next= when switching pages

  function welcome(user, confirmed) {
    $('signin').hidden = true;
    $('welcome').hidden = false;
    $('welcomeTitle').textContent = 'Welcome, ' + CCFAuth.displayName(user);
    $('welcomeText').textContent = (confirmed ? 'Your email is confirmed. ' : '') + 'Taking you to the globe…';
    setTimeout(() => location.replace(next()), confirmed ? 1600 : 700);
  }

  // Opened from the confirmation email, or already signed in on this browser
  if (CCFAuth.configured) {
    const fromEmail = /access_token=/.test(location.hash);
    if (/error_description=/.test(location.hash)) {
      const p = new URLSearchParams(location.hash.slice(1));
      say((p.get('error_description') || 'That link did not work.').replace(/\+/g, ' ') + ' Try signing in, or ask for a new link.');
      history.replaceState(null, '', location.pathname + location.search);
    } else if (CCFAuth.maybeSignedIn()) {
      CCFAuth.session().then((s) => { if (s) welcome(s.user, fromEmail); }).catch(() => {});
    }
  }

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = $('email').value.trim(), password = $('password').value;
    if (!email || !password) return say('Please enter your email and password.');
    busy($('go'), 'Signing in…', async () => {
      const db = await CCFAuth.client();
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
      welcome(data.user, false);
    });
  });
})();
</script>
</body>
</html>
